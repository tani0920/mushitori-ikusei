<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>むなかた虫そだて</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="むなかた虫そだて">
<meta name="theme-color" content="#1e2f24">
<script>
// /demo/ から開いたときはデモ版：セーブを本番と分け、検索サイトに出さない（虫とり日記と同じルール）
window.DEMO = /\/demo\//.test(location.pathname);
if(DEMO){
  document.title = '【デモ】' + document.title;
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = '虫そだて デモ';
  document.write('<meta name="robots" content="noindex,nofollow">');
}
</script>
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
// アイコンを作り直したら ICON_VER を変える（iPhone・iPad が古いアイコンを覚えたままにならないように）
(function(){
  var ICON_VER = '1' + (window.DEMO ? '-demo' : '');
  document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"],link[rel="manifest"]').forEach(function(l){ l.href = l.getAttribute('href') + '?v=' + ICON_VER; });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 見た目は「むなかた虫とり日記」の家族：森のフレーム＋RPGウィンドウ。こちらは昼の飼育ケースなので、少し明るい苔色 */
:root{
  --frame:#1e2f24;      /* 苔の森 */
  --frame-2:#2b4233;
  --ink:#f7f1df;
  --win:#14284a;
  --edge:#f7f1df;
  --sun:#f4b63c;
  --ok:#5ccf6a;
  --low:#e8553e;
  --paper:#f3ead2;
  --paper-ink:#2c2418;
  --paper-line:#d8c9a3;
  --mute:#a9bba9;
  --f-pixel:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{min-height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--f-pixel);line-height:1.6;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
#app{max-width:680px;margin:0 auto;padding-block:8px 12px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:400;letter-spacing:.08em;color:var(--sun)}
header small{color:var(--mute);font-size:12px}
#hud{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;align-items:center;font-variant-numeric:tabular-nums;min-height:22px}
#hud .money{color:var(--sun)}
#hud .slot{display:inline-flex;align-items:center;gap:.3em}
ruby.fr rt{font-size:.5em;letter-spacing:0;font-weight:400;opacity:.9}
.win{background:var(--win);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--win);color:var(--ink);padding:.6em .9em;line-height:1.6}
.btn{font:inherit;background:var(--win);color:var(--ink);border:2px solid var(--edge);border-radius:8px;padding:.45em 1em;cursor:pointer;box-shadow:0 2px 0 #0006}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.pri{background:var(--sun);color:#1b130c;border-color:var(--sun)}
.btn.sub{background:#ffffff18}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.small{font-size:12px;color:var(--mute)}
h2{margin:.2em 0;font-weight:400;font-size:18px;letter-spacing:.08em;color:var(--sun)}
h3{margin:.6em 0 .2em;font-weight:400;font-size:15px;letter-spacing:.06em;color:#fff;border-bottom:1px solid #f7f1df44}
p{margin:.3em 0}

/* タイトル */
#titleScr{position:relative;min-height:calc(100dvh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center;
  background:linear-gradient(#5aa6d8 0%,#a9d7ea 45%,#6c9a4a 46%,#4e7a36 70%,#5a3d22 71%,#3b2715 100%);border:4px solid var(--frame-2);border-radius:8px;overflow:hidden;padding:5% 4% 4%}
#titleScr .t1{font-size:clamp(13px,3.5vw,20px);color:#fff;letter-spacing:.2em;text-shadow:2px 2px 0 #0008}
#titleScr .t2{font-size:clamp(30px,9vw,56px);color:var(--sun);letter-spacing:.06em;text-shadow:3px 3px 0 #5a2a10,-1px -1px 0 #fff3;line-height:1.15;margin:.1em 0}
#titleScr .t3{font-size:clamp(11px,2.8vw,15px);color:#fff;text-shadow:1px 1px 0 #0009;max-width:30em}
#titleScr .t4{max-width:34em;margin-top:.6em;padding:.35em .8em;font-size:clamp(9px,2.1vw,12px);line-height:1.5;color:#fff;background:#0006;border-radius:4px}
#titleScr .sun{position:absolute;right:9%;top:7%;width:12%;max-width:70px;aspect-ratio:1;border-radius:50%;background:#ffe27a;box-shadow:0 0 0 6px #ffe27a44}
#titleScr .hero{width:min(60%,260px);margin:.3em 0}
#titleScr .tbtns{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;margin-top:.7em}
#titleScr .tbtn{font:inherit;font-size:clamp(13px,3vw,17px);color:#fff;background:#14284acc;border:2px solid #f7f1df;border-radius:999px;padding:.4em 1.2em;cursor:pointer;box-shadow:0 2px 0 #0006}
#titleScr .tbtn.pri{background:var(--sun);color:#1b130c;border-color:#fff}
#titleScr .vrow{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin-top:.6em}
#titleScr .verbtn{font-family:var(--f-pixel);font-size:clamp(9px,2vw,13px);letter-spacing:.04em;color:#fff;background:#14284a99;border:1px solid #f7f1dfaa;border-radius:999px;padding:.2em .8em;cursor:pointer;text-shadow:1px 1px 0 #000}
#titleScr .credit{position:absolute;right:.8em;top:.6em;font-size:clamp(9px,1.9vw,12px);letter-spacing:.06em;color:#fff;opacity:.92;text-shadow:1px 1px 0 #000;pointer-events:none}

/* 下のタブ（スマホで親指がとどく場所） */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:#14284aee;border-top:2px solid var(--edge)}
#tabs button{font:inherit;flex:1;max-width:150px;font-size:13px;color:var(--ink);background:transparent;border:2px solid #f7f1df55;border-radius:10px;padding:.5em .2em;cursor:pointer;line-height:1.2}
#tabs button .ic{display:block;font-size:20px;line-height:1.1}
#tabs button.on{background:var(--sun);color:#1b130c;border-color:var(--sun)}
#tabs button .badge{position:absolute;transform:translate(.4em,-1.4em);background:var(--low);color:#fff;font-size:10px;border-radius:999px;padding:0 .45em}
#tabs button{position:relative}

/* おうち：飼育ケースの一覧 */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.case{background:var(--win);border:3px solid var(--edge);border-radius:8px;padding:.5em;cursor:pointer;display:flex;flex-direction:column;gap:.3em;box-shadow:0 0 0 2px var(--win)}
.case.empty{opacity:.75;border-style:dashed;justify-content:center;align-items:center;min-height:180px;color:var(--mute)}
.case .pic{height:110px;border-radius:6px;overflow:hidden;position:relative}
.case .pic svg{width:100%;height:100%}
.case .nm{font-size:15px;color:#fff}
.case .st{font-size:12px;color:var(--mute)}
.case .alert{position:absolute;right:4px;top:4px;background:var(--low);color:#fff;font-size:11px;border-radius:999px;padding:0 .5em}
.case .ev{position:absolute;left:4px;top:4px;background:var(--sun);color:#1b130c;font-size:11px;border-radius:999px;padding:0 .5em;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.meters{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;align-items:center}
.bar{display:block;width:100%;height:9px;background:#0006;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.bar i.mid{background:var(--sun)}
.bar i.low{background:var(--low)}

/* 観察（ケースの断面） */
#obs .scene{position:relative;width:100%;aspect-ratio:4/3;border:4px solid var(--frame-2);border-radius:8px;overflow:hidden;background:#000}
#obs .scene svg{width:100%;height:100%;display:block}
#obs .obsTxt{margin-top:6px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.acts .btn{padding:.6em .4em;font-size:14px;line-height:1.3}
.acts .btn small{display:block;font-size:11px;color:var(--mute)}
.acts .btn.pri small{color:#1b130c99}

/* そと */
.spots{display:grid;gap:8px}
.spot{background:var(--win);border:3px solid var(--edge);border-radius:8px;padding:.5em .8em;box-shadow:0 0 0 2px var(--win)}
.spot b{color:var(--sun);font-weight:400}
.spot .bugs{font-size:12px;color:var(--mute)}
.spot.here{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.found{display:flex;flex-direction:column;align-items:center;gap:.4em;padding:.6em}
.found .pic{width:min(60%,220px);aspect-ratio:1}
.found .pic svg{width:100%;height:100%}
.found .ex{position:absolute;font-size:40px;color:var(--sun);text-shadow:2px 2px 0 #000;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.search{text-align:center;padding:1em}
.search .dots::after{content:'…';animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:''}33%{content:'・'}66%{content:'・・'}100%{content:'・・・'}}

/* ずかん */
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.dexGrid .d{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:.4em;text-align:center;cursor:pointer;border:2px solid var(--paper-line);font-size:12px}
.dexGrid .d svg{width:100%;aspect-ratio:1}
.dexGrid .d.no{opacity:.6}
.dexGrid .d .mk{display:block;color:#7a5a20}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:.8em 1em;line-height:1.7}
.paper h3{color:#5a3a10;border-color:var(--paper-line)}
.paper .pic{width:min(50%,200px);aspect-ratio:1;margin:0 auto}
.paper .pic svg{width:100%;height:100%}
.paper table{border-collapse:collapse;font-size:13px;width:100%}
.paper td{border-bottom:1px solid var(--paper-line);padding:.25em .3em;vertical-align:top}
.paper td:first-child{white-space:nowrap;color:#7a5a20}

/* 全画面パネル（ずかん・説明など）：「とじる」はいつも右下 */
.full{position:fixed;inset:0;z-index:100;overflow-y:auto;background:var(--frame);
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.full .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.full .top{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid #f7f1df55;padding-bottom:6px}
.full .top h2{margin:0}
.full .close{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:101;font-size:17px;padding:.55em 1.5em;box-shadow:0 3px 0 #0006,0 0 0 2px var(--frame)}
.chlog h3{margin:.8em 0 .2em}
.chlog .now{font-size:11px;background:var(--sun);color:#1b130c;border-radius:999px;padding:0 .5em;margin-left:.5em}
.chlog ul{margin:.2em 0 .6em;padding-left:1.3em;font-size:13px}
.chlog li{margin:.15em 0}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
.opt .btn span.v{color:var(--sun)}
.demoBox{border:2px dashed var(--low);border-radius:8px;padding:.6em .8em}
.demoBox h3{color:var(--low);border:0}

/* メッセージ（RPGの窓） */
#msgLayer{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#0005}
#msgLayer .win{width:min(100%,600px);font-size:16px;cursor:pointer;white-space:pre-line}
#msgLayer .win .tap{display:block;text-align:right;font-size:12px;color:var(--mute);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#msgLayer .win .ans{display:flex;flex-direction:column;gap:.4em;margin-top:.6em}
#msgLayer .yk{color:var(--sun)}

/* 新しい版のお知らせ（虫とり日記と同じ） */
.updBar{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:10000;display:flex;align-items:center;justify-content:center;gap:.6em;white-space:nowrap;background:#14284af0;color:#fff;border:2px solid var(--sun);border-radius:10px;padding:.4em .5em .4em .9em;box-shadow:0 4px 12px #0008;font-size:13px}
.updBar button{font:inherit;background:var(--sun);color:#1b130c;border:0;border-radius:6px;padding:.35em .8em;cursor:pointer;white-space:nowrap}
.updAsk{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:#0008;padding:16px}
.updAsk .box{background:#14284a;color:#fff;border:2px solid var(--sun);border-radius:12px;padding:1em 1.1em;max-width:22em;font-size:15px;line-height:1.7;box-shadow:0 6px 18px #000a}
.updAsk .box b{color:var(--sun)}
.updAsk .row{display:flex;flex-direction:column;gap:.5em;margin-top:.9em}
.updAsk button{font:inherit;border:0;border-radius:8px;padding:.6em .8em;cursor:pointer}
.updAsk .go{background:var(--sun);color:#1b130c}
.updAsk .later{background:#ffffff22;color:#fff}
.demoBadge{position:fixed;right:env(safe-area-inset-right,0px);top:env(safe-area-inset-top,0px);z-index:9999;background:#c0392b;color:#fff;font-size:10px;letter-spacing:.1em;padding:1px 7px;border-radius:0 0 0 6px;opacity:.9;pointer-events:none}
.saveMark{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:#0009;color:#fff;font-size:11px;border-radius:999px;padding:.1em .8em;opacity:0;transition:opacity .3s;pointer-events:none}
.saveMark.on{opacity:1}

/* 虫のアニメーション（パーツ分けした2D：はね・足・体のふしを動かす） */
.bug *{transform-box:fill-box;transform-origin:center}
.bug .wing{transform-origin:right center;animation:flap 1.1s ease-in-out infinite}
.bug .wing.r{animation-delay:-.0s}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
.bug.rest .wing{animation:none;transform:scaleX(.12)}
.bug.sil{filter:brightness(0) opacity(.45)}
.bug .seg{animation:wig 1s ease-in-out infinite}
.bug .seg:nth-child(even){animation-delay:-.5s}
@keyframes wig{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.bug .leg{transform-origin:top center;animation:step .5s ease-in-out infinite alternate}
.bug .leg.b{animation-delay:-.25s}
@keyframes step{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.bug .ant{transform-origin:bottom center;animation:ant 2.4s ease-in-out infinite}
.bug .ant.r{animation-delay:-1.2s}
@keyframes ant{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.bug .grub{animation:grub 2.4s ease-in-out infinite}
@keyframes grub{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bug .pupa{animation:breath 3s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.bug .glow{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.15}50%{opacity:1}}
.bug .hop{animation:hop 3.2s ease-in-out infinite}
@keyframes hop{0%,80%,100%{transform:translateY(0)}87%{transform:translateY(-6px)}94%{transform:translateY(0)}}
.bug.sleep *{animation:none!important}
.bug.sleep .body{animation:breath 4s ease-in-out infinite!important}
.note{animation:note 1.6s linear infinite;opacity:0}
.note.b{animation-delay:-.8s}
@keyframes note{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(6px,-22px);opacity:0}}
.zz{animation:zz 2.4s linear infinite;opacity:0}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(4px,-16px);opacity:0}}

/* 成長イベントの演出 */
#evLayer{position:fixed;inset:0;z-index:150;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#evLayer .stage{position:relative;width:min(80vw,320px);aspect-ratio:1}
#evLayer .stage .ly{position:absolute;inset:0}
#evLayer .stage svg{width:100%;height:100%}
#evLayer .ttl{font-size:clamp(20px,6vw,32px);color:var(--sun);text-shadow:2px 2px 0 #5a2a10;letter-spacing:.1em;animation:pop .6s}
#evLayer .cap{color:#fff;font-size:15px;text-align:center;white-space:pre-line}
.ev-old{animation:evOld 2.4s ease-in forwards}
@keyframes evOld{0%{opacity:1;transform:scale(1)}60%{opacity:.9;transform:scale(1.04)}100%{opacity:0;transform:translateY(18px) scale(.9)}}
.ev-new{animation:evNew 2.6s ease-out forwards;opacity:0}
@keyframes evNew{0%{opacity:0;transform:scale(.6)}55%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.ev-crack{animation:evCrack 2.2s ease-in forwards}
@keyframes evCrack{0%{opacity:1;transform:scaleY(1)}40%{transform:scaleY(1.06) rotate(-2deg)}70%{opacity:1;transform:scaleY(.9) rotate(2deg)}100%{opacity:0;transform:scaleY(.6)}}
.ev-emerge .wing{animation:unfold 2.2s 1.6s ease-out forwards;transform:scaleX(.05)}
@keyframes unfold{0%{transform:scaleX(.05)}60%{transform:scaleX(1.05)}100%{transform:scaleX(1)}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffe27a;animation:spark 1.6s ease-out infinite;opacity:0}
@keyframes spark{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.2)}}

/* お世話の道具と、ケースの中の指の操作 */
#obs .scene{touch-action:none;cursor:pointer;position:relative}
.toolObj{position:absolute;left:0;top:0;font-size:60px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 3px #0009);z-index:3;touch-action:none;cursor:grab;transition:left .3s,top .3s;user-select:none}
.toolObj::after{content:'';position:absolute;inset:-14px;border-radius:50%}
.toolObj.rest{animation:toolPop .45s}
@keyframes toolPop{0%{transform:translate(-50%,-50%) scale(.3)}70%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
.toolObj.drag{transition:none;transform:translate(-50%,-50%) scale(1.08);cursor:grabbing}
.toolObj.wipe{animation:wipeIc .35s ease-in-out infinite alternate}
@keyframes wipeIc{from{transform:translate(-50%,-50%) rotate(-14deg) scale(1.08)}to{transform:translate(-50%,-50%) rotate(14deg) scale(1.08)}}
.toolObj.spray{animation:sprayIc .25s ease-in-out infinite alternate}
@keyframes sprayIc{from{transform:translate(-50%,-50%) scale(1.08)}to{transform:translate(-50%,-50%) scale(.98)}}
.toolObj .hint{position:absolute;left:50%;top:-1.1em;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:#14284acc;color:#fff;border-radius:999px;padding:0 .6em;border:1px solid #f7f1df88}
.ripple{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #fff;pointer-events:none;transform:translate(-50%,-50%) scale(.3);animation:ripple .5s ease-out forwards;z-index:2}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
.mini{position:absolute;left:6px;top:6px;z-index:4;background:#14284acc;color:#fff;border:2px solid #f7f1df88;border-radius:8px;padding:.25em .6em;font-size:12px;min-width:46%;pointer-events:none;line-height:1.4}
.mini .bar{height:10px;margin-top:2px}

   ========================================================= */
let updShown = false;
async function checkUpdate(){
  if(BUILD === 'dev' || updShown) return;
  try{
    const j = await (await fetch('version.json?t=' + Date.now(), {cache:'no-store'})).json();
    if(!j.build || j.build === BUILD) return;
    updShown = true;
    const b = document.createElement('div'); b.className = 'updBar';
    b.innerHTML = `<span>新しいバージョンがあります</span><button type="button">こうしんする</button>`;
    const go = ()=> location.replace(location.pathname + '?u=' + encodeURIComponent(j.build));
    b.querySelector('button').onclick = ()=>{
      if(!S){ go(); return; }   // タイトル画面なら、消えるものはない
      const a = document.createElement('div'); a.className = 'updAsk';
      a.innerHTML = `<div class="box"><b>セーブをわすれずに！</b><br>こうしんすると、ページを読みこみなおします。<br>いまのようすをセーブしてから、こうしんしますか？<div class="row"><button type="button" class="go">セーブして、こうしんする</button><button type="button" class="later">あとで</button></div></div>`;
      a.querySelector('.go').onclick = ()=>{ save(); go(); };
      a.querySelector('.later').onclick = ()=> a.remove();
      document.body.appendChild(a);
    };
    document.body.appendChild(b);
  }catch(e){}
}
checkUpdate();

const FURI_KEY = KEY_PRE + 'munakata-furigana-v1';   // 虫とり日記と同じキー名にしているので、どちらかで切りかえると両方にきく
let furiMode = (()=>{ try{ return localStorage.getItem(FURI_KEY) === '1'; }catch(e){ return false; } })();
let rubyMap = {}, rubyRe = null;
function buildRuby(){
  const min = furiMode ? 3 : 5; rubyMap = {};
  for(const w in RUBY){ const [rd, g] = RUBY[w].split('|'); if(+g >= min) rubyMap[w] = rd; }
  const keys = Object.keys(rubyMap).sort((a,b)=>b.length - a.length);
  rubyRe = keys.length ? new RegExp(keys.join('|'), 'g') : null;
}
const isKana = c=> /[぀-ゟ]/.test(c);
function rubyNode(w){   // 送りがななど、ことばの前後のひらがなにはふりがなを付けない
  const rd = rubyMap[w]; let pre = 0, suf = 0;
  while(pre < w.length && isKana(w[pre]) && rd[pre] === w[pre]) pre++;
  while(suf < w.length - pre && isKana(w[w.length-1-suf]) && rd[rd.length-1-suf] === w[w.length-1-suf]) suf++;
  const f = document.createDocumentFragment();
  if(pre) f.appendChild(document.createTextNode(w.slice(0, pre)));
  const r = document.createElement('ruby'); r.className = 'fr';
  r.appendChild(document.createTextNode(w.slice(pre, w.length - suf)));

/* その場所の虫。slot を渡すと「いま活動している虫」だけ。活動していない時間でも、幼虫はさがせる（出にくいだけ）。見るだけの虫（ホタル）は活動時間だけ
   夜しか活動しない虫のために、夜に山へ行かなくてもすむようにしている。活動時間でないときに見つけると「めずらしい」と教えてくれる */
const spotBugs = (key, slot)=> Object.keys(BUGS).filter(id=> !BUGS[id].npc && !BUGS[id].link && (BUGS[id].spots.includes(key) || BUGS[id].spots.includes('any')) && (!slot || BUGS[id].time.includes(slot)));
const findable = (key, slot)=> spotBugs(key).filter(id=> !BUGS[id].watch || BUGS[id].time.includes(slot));
function distM(a, b, c, d){ const R = 6371000, r = Math.PI/180, x = (d-b)*r*Math.cos((a+c)/2*r), y = (c-a)*r; return Math.hypot(x, y) * R; }
function nearSpot(lat, lon){
  let best = null;
  for(const sp of SPOTS) for(const [a, b, rad] of sp.pts){ const k = distM(lat, lon, a, b) / rad; if(k <= 1 && (!best || k < best.k)) best = {sp, k}; }
  return best && best.sp;
}
function getPos(){
  const t = QS.get('geo');   // 画面確認用：?geo=緯度,経度
  if(t){ const [a, b] = t.split(',').map(Number); return Promise.resolve({lat:a, lon:b}); }
  return new Promise((res, rej)=>{
    if(!navigator.geolocation) return rej(new Error('none'));
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude, lon:p.coords.longitude}), rej, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
  });
}

/* =========================================================
   成長の計算
   虫ごとに、おなか・しめりけ・きれいさ が時間とともにへる。3つの平均が「元気」。
   元気が高いと育ちが進み、低いと止まる。元気がとても低いままだと、虫は自然にかえる（死なせない。でも、お世話しないとさよならになる）
   すがたがかわるタイミングは「次にケースをのぞいたとき」にアニメーションで見せる（pending）
   世話のしかたは log に記録して、すがたがかわるときにステータスへ変える
   ========================================================= */
function stageOf(c){ return BUGS[c.bug].plan[c.si]; }
function genkiOf(c){ const st = stageOf(c); const g = st.k === 'pupa' ? (c.wet*2 + c.clean)/3 : (c.hunger + c.wet + c.clean)/3; return Math.round(clamp(g - (c.trouble ? 20 : 0) - ((c.soak||0) > 30 ? 15 : 0), 0, 100)); }
function tickCase(c){
  const t = now(); let h = (t - c.tick) / H; if(h <= 0) return; if(h > 24*60) h = 24*60;
  c.tick = t;
  const st = stageOf(c), tough = BORN[c.born] && BORN[c.born].tough;
  const wetK = (c.place === 'beranda' ? 1.25 : 1) * (tough ? .8 : 1), cleanK = (c.place === 'genkan' ? .85 : 1) * (c.wide ? .9 : 1);
  c.dirt = c.dirt || []; c.foods = c.foods || []; c.soak = c.soak || 0;
  let left = h;
  while(left > 0){
    const d = Math.min(1, left); left -= d;
    if(st.k !== 'pupa') c.hunger = clamp(c.hunger - 100/HUNGER_H*d, 0, 100);
    // エサ：置いてあれば、虫が自分で食べにきておなかがふえる。古くなると食べない
    const fresh = c.foods.filter(f=>!f.old);
    if(st.k !== 'pupa' && fresh.length && c.hunger < 100){ const f = fresh[0]; const eat = Math.min(30*d, 100 - c.hunger, f.left*100); c.hunger += eat; f.left -= eat/100; if(f.left <= 0.02) c.foods.splice(c.foods.indexOf(f), 1); }
    c.foods.forEach(f=>{ f.age += d; if(f.age > 36 && !f.old){ f.old = true; c.clean = clamp(c.clean - 8, 0, 100); } });
    c.soak = Math.max(0, c.soak - 100/12*d);   // 水たまりは半日でひく
    c.wet = clamp(c.wet - 100/WET_H*d*wetK + (c.soak > 0 ? 100/WET_H*d*wetK : 0), 0, 100);   // びちゃびちゃの間はかわかない
    c.clean = clamp(c.clean - 100/CLEAN_H*d*cleanK, 0, 100);
    // よごれ：きれいさがへるぶんだけ、ガラスや土によごれがふえる
    const want = Math.round((100 - c.clean)/12.5);
    while(c.dirt.length < want) c.dirt.push({x:8 + Math.random()*84, y:10 + Math.random()*80, hp:3, k:Math.random() < .6 ? 'fun' : 'kumori'});
    const g = genkiOf(c);
    c.log.hours += d; if(g < 30) c.log.lowH += d;
    if(!c.pending){ const sp = g >= 60 ? 1 : g >= 30 ? .5 : 0; c.prog += d*sp; if(c.prog >= st.days*24){ c.prog = st.days*24; c.pending = true; } }
    if(g < 15){ c.weak = (c.weak||0) + d; if(c.weak >= WEAK_H && !c.gone) c.gone = true; } else c.weak = 0;
    // トラブル：しめりすぎ＋よごれ → カビ。おなかすき＋よごれ → アリ（1時間ごとに少しの確率）
    if(!c.trouble && st.k !== 'adult' || !c.trouble){
      if((c.soak > 30 || c.wet > 85) && c.clean < 60 && Math.random() < (c.soak > 30 ? .05 : .02)*d){ c.trouble = 'kabi'; for(let i=0;i<3;i++) c.dirt.push({x:15 + Math.random()*70, y:60 + Math.random()*25, hp:3, k:'kabi'}); }
      else if(c.foods.some(f=>f.old) && c.clean < 70 && Math.random() < .04*d){ c.trouble = 'ari'; }
    }
  }
}
function tickAll(){ if(!S) return; S.cases.forEach(c=>{ if(c) tickCase(c); }); }

function forecast(c){

  const st = stageOf(c), b = BUGS[c.bug], nx = b.plan[c.si+1], leftH = st.days*24 - c.prog;
  if(!nx || leftH > 24) return null;
  if(st.k === 'larva' && nx.k === 'larva') return 'そろそろ脱皮しそう。じっと動かなくなっても、心配しないでね。';
  if(nx.k === 'pupa') return 'そろそろさなぎになりそう。糸をはいたり、土にもぐったりしたら、さわらないで。';
  if(b.shape === 'butterfly') return '明日の朝、羽化するかも！ 朝いちばんにのぞいてみよう。';
  if(b.shape === 'beetle' || b.shape === 'stag') return '明日の夜、土から出てくるかも！ 夜にのぞいてみよう。';

/* 世話の記録 → ステータス（すがたがかわるときに1回）。育て方で伸びるところがちがう */
function applyGrowth(c){
  const L = c.log, days = Math.max(1, L.hours/24), ind = c.ind, T = c.tot;
  const feedRate = L.feed/days, fullRate = L.feed ? L.feedFull/L.feed : 0;
  ind.atk += clamp(feedRate*.02, 0, .04) + (fullRate > .5 ? .02 : 0);
  ind.hp  += clamp(feedRate*.01, 0, .02) + (L.lowH < 6 ? .02 : 0);
  ind.spd += (c.wide ? .04 : .01) + (c.place === 'heya' ? .01 : 0);
  ind.def += (c.place === 'beranda' ? .04 : .01) + (L.lowH > 24 && L.lowH < 72 ? .01 : 0);
  ind.heal += clamp(L.clean/days*.015, 0, .03) + (c.place === 'genkan' ? .02 : 0);
  for(const k in L) T[k] += L[k];
  c.log = newLog();
}
/* 羽化のとき：生まれ・運・性格・大きさ・わざを決める */
function finalize(c){
  const b = BUGS[c.bug], born = BORN[c.born] || BORN.any, ind = c.ind, T = c.tot;
  for(const k in born.st) ind[k] += born.st[k];
  if(c.born === 'any'){ ind[pick(['hp','atk','def','spd','heal'])] += .05; }
  for(const k in ind) ind[k] = +(ind[k] + (Math.random()*.08 - .04)).toFixed(3);
  // 性格：世話の傾向と生まれで点をつけて、いちばん高いもの
  const days = Math.max(1, T.hours/24), sc = {futsu:1};
  sc.kuishinbo = (T.feed ? T.feedFull/T.feed : 0)*3 + T.feed/days;
  sc.yancha = (c.wide ? 2.5 : 0) + (c.place === 'heya' ? .5 : 0);
  sc.nonbiri = (c.place === 'genkan' ? 2 : 0) + clamp(T.clean/days, 0, 1.5);
  sc.gaman = T.lowH > 24 ? 2.5 : T.lowH > 12 ? 1 : 0;
  sc.okubyo = T.over >= 6 ? 3 : T.over >= 3 ? 1.5 : 0;
  sc.hitonatsu = c.place === 'heya' ? 2 : 0;
  sc.makezu = 0;
  if(born.pers) sc[born.pers] = (sc[born.pers]||0) + 1.5;
  for(const k in sc) sc[k] += Math.random()*.8;
  c.pers = Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];
  // 大きさ：エサと元気で決まる。オスメス
  c.sex = Math.random() < .6 ? 'オス' : 'メス';
  const q = clamp((ind.atk + ind.hp - 2)/.3, 0, 1) * .6 + Math.random()*.4 + (born.luck && Math.random() < .3 ? .15 : 0);
  const [mn, mx] = b.size; c.size = Math.round((mn + (mx-mn)*q) * (c.sex === 'メス' ? .8 : 1));
  c.rare = (born.rareColor && Math.random() < .25) || (born.luck && Math.random() < .15);
  // わざ：基本わざ ＋ いちばん伸びたステータスの得意わざ
  const grow = {atk:ind.atk, def:ind.def, spd:ind.spd}, best = Object.keys(grow).sort((a,b)=>grow[b]-grow[a])[0];
  c.moves = [b.shape, MOVES[b.shape + '_' + best] ? b.shape + '_' + best : b.shape];
  c.uka = dayKey();
}
/* 虫ずもう用の数字（虫とり日記の式をもとに、種類の差を小さくして、育て方の差が効くようにした） */
function fighterOf(c, name){
  const b = BUGS[c.bug], t = TYPES[SHAPE_TYPE[b.shape]], ind = c.ind || {hp:1, atk:1, def:1, spd:1, heal:1}, lv = 8 + (c.lv || b.lv)*.5;
  const sizeK = c.size ? .9 + .2*clamp((c.size - b.size[0])/(b.size[1]-b.size[0]), 0, 1) : 1;
  const maxhp = Math.round((28 + lv*4.2) * t.hp * ind.hp * sizeK);
  return {name:name || c.name || b.name, id:c.bug, b, t, lv, maxhp, hp:maxhp, atk:(5 + lv*.8) * t.atk * ind.atk * sizeK, def:t.def / ind.def, spd:b.spd * ind.spd, heal:t.heal * ind.heal,
    moves:(c.moves || [b.shape]).map(k=>MOVES[k]), pers:PERS[c.pers || 'futsu'], night:c.bornSlot === 'yoru', guard:false, open:1, blind:0, weak:1, charm:0, counter:false};
}
const mark = (v, hi, lo)=> v >= hi ? '◎' : v <= lo ? '△' : '○';

const SKY = {asa:['#9ad0f0','#e8f4c0'], hiru:['#5aa6d8','#a9d7ea'], yu:['#f0a060','#f8d8a0'], yoru:['#0e1a3a','#24345a']};

const HIDE_POS = {soil:{x:30, y:44}, leaf:{x:62, y:34}, grass:{x:22, y:60}};   // かくれ家の位置
function hideKind(b){ return (b.shape === 'beetle' || b.shape === 'stag') ? 'soil' : b.shape === 'butterfly' ? 'leaf' : 'grass'; }
function isHiding(c, slot){   // かくれているか：ふられた直後、または おくびょう・のんびり以外でも昼間は少し
  if((c.hideUntil||0) > now()) return true;

  if(c.pers === 'okubyo') return true;
  return false;
}
function placeBug(c, slot){   // どこに、どんなすがたでいるか

  const pers = c.pers && st === 'adult' ? PERS[c.pers] : null;
  if(hiding){ const h = HIDE_POS[hideKind(b)]; return {x:h.x, y:h.y + 4, s:.42, o:{instar:ins, sleep:true}, txt: pers === PERS.okubyo ? 'かくれ家のかげに、じっとかくれている。おくびょうなんだ。' : 'かくれ家にかくれている。そっとしておこう。', hidden:true}; }
  if(fresh && st !== 'pupa' && !(b.shape === 'beetle' || b.shape === 'stag') ){ return {x:fresh.x, y:fresh.y - 6, s:.5, o:{instar:ins}, txt:`置いた${ITEMS[fresh.k].name}を、むしゃむしゃ食べにきた！`, eating:true}; }

  if(b.shape === 'beetle' || b.shape === 'stag'){
    if(st === 'larva') return {x:30, y:66, s:.42, o:{instar:ins}, txt:'土の中で、ゆっくり動いている。土の中のくさった葉を食べているよ。'};
    if(st === 'pupa') return {x:60, y:66, s:.42, o:{}, txt:'土の中に、たまごのような部屋を作って、その中でさなぎになっている。ぜったいにこわさないでね。', chamber:true};

    if(st === 'pupa') return {x:70, y:26, s:.4, o:{}, txt:'葉のうらに、糸でぶらさがっている。中では体が作りかえられているところ。'};

  }

  }
  if(b.shape === 'cricket'){
    if(night || slot === 'yu'){ return {x:50, y:46, s:.55, o:{sing: st === 'adult', instar:ins}, txt: st === 'adult' ? 'リーンリーン…。はねをこすりあわせて鳴いている！' : '暗くなってきて、かくれ家から出てきた。'}; }

  return g(`<ellipse cx="50" cy="54" rx="16" ry="6" fill="${col||'#9ad0f0'}" stroke="#f7f1df" stroke-width="1.5"/>`);   // さとう水の皿

function sceneSVG(c, slot){
  const b = BUGS[c.bug], st = stageOf(c).k, soilKind = b.shape === 'beetle' || b.shape === 'stag', [s1, s2] = SKY[slot], p = placeBug(c, slot);

  const soilTop = soilTopOf(b), hk = hideKind(b), H = HIDE_POS[hk];

  else plants = [12,22,30,62,72,84,92].map((x,i)=>`<path d="M${x} ${soilTop} C ${x+2} ${soilTop-14}, ${x-4} ${soilTop-22}, ${x+(i%2?3:-2)} ${soilTop-30}" stroke="#5a9a3a" stroke-width="2" fill="none"/>`).join('') +
      `<g class="leaf" data-hide="1"><path d="M14 ${soilTop} L22 ${soilTop-12} L40 ${soilTop-12} L44 ${soilTop} Z" fill="#8a6a3a"/></g>`;

    ${[[8,80],[24,90],[48,84],[70,78],[88,92],[36,74],[60,94]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4" fill="#3b2715"/>`).join('')}

}

function say(text, opts={}){
  return new Promise(res=>{
    const L = document.createElement('div'); L.id = 'msgLayer';
    const w = document.createElement('div'); w.className = 'win';
    w.innerHTML = fmtMsg(text) + (opts.ans ? '' : '<span class="tap">▼ タップでつぎへ</span>');
    if(opts.ans){ const a = document.createElement('div'); a.className = 'ans';
      opts.ans.forEach((t,i)=>{ const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (i===0 ? ' pri' : ''); b.textContent = t; b.onclick = e=>{ e.stopPropagation(); L.remove(); res(i); }; a.appendChild(b); });
      w.appendChild(a);
    } else { L.onclick = ()=>{ L.remove(); res(0); }; }
    L.appendChild(w); document.body.appendChild(L);
  });
}
const fmtMsg = t=> esc(t).replace(/【([^】]+)】/g, '<b class="yk">【$1】</b>').replace(/\n/g, '<br>');
const ask = (text, yes='はい', no='いいえ')=> say(text, {ans:[yes, no]}).then(i=> i === 0);
function askText(text, def=''){
  return new Promise(res=>{
    const L = document.createElement('div'); L.id = 'msgLayer';
    L.innerHTML = `<div class="win">${fmtMsg(text)}<input type="text" maxlength="10" value="${esc(def)}"><div class="ans"><button type="button" class="btn pri">きめた</button></div></div>`;
    const inp = L.querySelector('input'); L.querySelector('button').onclick = ()=>{ const v = inp.value.trim(); L.remove(); res(v); };
    inp.onkeydown = e=>{ if(e.key === 'Enter') L.querySelector('button').click(); };
    document.body.appendChild(L); inp.focus(); inp.select();
  });
}

}

      <tr><td>基本わざ</td><td>${esc(MOVES[b.shape].name)}（${esc(MOVES[b.shape].info)}）</td></tr>
      <tr><td>得意わざ</td><td>${['atk','def','spd'].filter(k=>MOVES[b.shape+'_'+k]).map(k=>`${{atk:'ちから型',def:'まもり型',spd:'すばやさ型'}[k]}：${esc(MOVES[b.shape+'_'+k].name)}`).join('<br>') || 'なし'}</td></tr>`}
      <tr><td>じっさいは</td><td>${esc(b.real)}</td></tr>
      <tr><td>飼いかた</td><td>${esc(b.care)}</td></tr>
      <tr><td>きろく</td><td>${esc(d.found)} に ${esc(d.where)} でみつけた${d.adult ? `<br>${esc(d.adult)} に羽化した` : ''}${d.best ? `<br>さいだい ${d.best}mm` : ''}${d.released ? `<br>${d.released}回、さいごまでそだててかえした` : ''}${bornList ? `<br>生まれ：${bornList}` : ''}</td></tr></table>`

/* ---- 虫ずもう（オート対戦：コマンドはなく、虫が自分で戦う） ---- */
const SUMO_REWIN = 10;
function renderSumo(){
  const adults = S.cases.map((c,i)=>({c,i})).filter(x=>x.c && stageOf(x.c).k === 'adult');
  view.innerHTML = `<h2>虫ずもう</h2><p class="small">広場の切りかぶの上で、近所の子どもたちが虫ずもうをしている。コマンドはなし。虫は、育てたとおりに自分で戦う。</p>
    ${adults.length ? `<p>出られる虫：${adults.map(x=>`<span class="tag">${esc(x.c.name||BUGS[x.c.bug].name)}</span>`).join(' ')}</p>` : '<p class="win">成虫になった虫がいないと、出られない。まずはそだてよう。</p>'}
    <p class="small">かちぬき：${S.stats.wins}勝 ${S.stats.loses}敗${S.sumoChamp ? '　<b style="color:var(--sun)">チャンピオン！</b>' : ''}</p>
    <div class="rivals">${RIVALS.map((r,i)=>{ const won = S.sumo[r.key], locked = i > 0 && !S.sumo[RIVALS[i-1].key], today = S.sumoDay[r.key] === dayKey();
      return `<div class="rival ${won ? 'won' : ''} ${locked ? 'locked' : ''}"><div class="pic">${svgBest(r.bug, {cls: locked ? 'sil' : ''})}</div>
        <div style="flex:1"><b>${esc(r.name)}</b>　<span class="small">${esc(BUGS[r.bug].name)}${won ? '　勝った！' : ''}</span><span class="small">${locked ? '前の相手に勝つと、ちょうせんできる' : esc(r.hi)}</span></div>
        <button type="button" class="btn ${won ? 'sub' : 'pri'}" data-r="${i}" ${locked || today || !adults.length ? 'disabled' : ''}>${today ? 'また明日' : 'ちょうせん'}</button></div>`; }).join('')}</div>
    <p class="small" style="margin-top:8px">【ルール】つっこむ＝ふつうの攻撃。ふんばる＝受けるダメージ半分、少し回復。わざ＝強いけど、次に動くまでスキができる。性格で、どれを選びやすいかがかわる。</p>`;
  view.querySelectorAll('[data-r]').forEach(bt=> bt.onclick = async ()=>{
    const r = RIVALS[+bt.dataset.r];
    let x = adults[0]; if(adults.length > 1){ const i = await say('どの虫で出る？', {ans:adults.map(a=>`${a.c.name||BUGS[a.c.bug].name}（${BUGS[a.c.bug].name}）`)}); x = adults[i]; }
    await sumoBattle(r, x.c);
  });
}
function npcFighter(r){ return fighterOf({bug:r.bug, lv:r.lv, pers:'futsu'}, r.short + 'の' + BUGS[r.bug].name); }
async function sumoBattle(r, c){
  const me = fighterOf(c), op = npcFighter(r), night = slotOf() === 'yoru';
  if(me.night && night) me.spd += 1;   // 夜型は夜に少しはやい
  S.sumoDay[r.key] = dayKey(); save();
  await say(`${r.name}「${r.hi}」`);
  const A = document.createElement('div'); A.id = 'arena';
  const info = (f, side)=> `<div class="info ${side}"><b>${esc(f.name)}</b> <small>${f.t.name}</small><span class="bar"><i id="hp-${side}" style="width:100%"></i></span><small id="hpn-${side}">${f.hp}/${f.maxhp}</small></div>`;
  A.innerHTML = `<div class="ring"><div class="dohyo"></div>${info(me,'l')}${info(op,'r')}<div class="vs norb">VS</div>
      <div class="fighter mine" id="f-l">${svgBest(me.id, {rare:c.rare})}</div><div class="fighter" id="f-r">${svgBest(op.id)}</div></div>
    <div class="log" id="blog"></div><div class="ctl"><button type="button" class="btn sub" id="bCheer">おうえん！</button><button type="button" class="btn" id="bFast">はやおくり</button></div>`;
  document.body.appendChild(A);
  let fast = false, cheer = 0; $('bFast').onclick = ()=>{ fast = true; $('bFast').disabled = true; };
  $('bCheer').onclick = e=>{ cheer++; const s = document.createElement('span'); s.className = 'cheer norb'; s.textContent = pick(['がんばれ！','いけー！','負けるな！']); s.style.left = (20 + Math.random()*40) + '%'; s.style.bottom = '30%'; A.querySelector('.ring').appendChild(s); setTimeout(()=>s.remove(), 1000); };
  const logEl = $('blog');
  const logLine = async (t, cls='')=>{ const d = document.createElement('div'); d.className = cls; d.textContent = t; logEl.appendChild(d); logEl.scrollTop = 1e6; await wait(fast ? 90 : 700); };
  const drawHp = f=>{ const side = f === me ? 'l' : 'r'; $('hp-'+side).style.width = Math.max(0, f.hp/f.maxhp*100) + '%'; $('hp-'+side).className = f.hp/f.maxhp < .3 ? 'low' : ''; $('hpn-'+side).textContent = `${Math.max(0,Math.round(f.hp))}/${f.maxhp}`; };
  const fx = (f, cls)=>{ const el = $('f-' + (f === me ? 'l' : 'r')); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), 450); };
  // 行動をえらぶ（性格の重み＋状況）
  function choose(f, o){
    if(f.charm > 0){ f.charm--; return 'charm'; }
    const w = Object.assign({}, f.pers.w), hp = f.hp/f.maxhp, ohp = o.hp/o.maxhp;
    if(hp < .35) w.guard += 2; if(f.pers === PERS.okubyo && hp < .5) w.guard += 3;
    if(f.pers === PERS.makezu && hp < ohp) w.sp += 4;
    if(f.pers === PERS.kuishinbo && hp > .5) w.sp += 2;
    if(f.lastGuard) w.guard = Math.max(0, w.guard - 3);   // 2回つづけてはふんばりにくい
    if(f.moves[1] && f.moves[1].heal && hp > .7) w.sp -= 2;
    const tot = w.atk + w.guard + w.sp; let r = Math.random()*tot;
    if((r -= w.atk) < 0) return 'atk'; if((r -= w.guard) < 0) return 'guard'; return 'sp';
  }
  function dmg(f, o, mult, pierce){
    let d = f.atk * mult * f.weak * (0.85 + Math.random()*.3) * o.def * o.open;
    if(o.guard && !pierce) d *= .5; if(o.pers === PERS.gaman && o.hp/o.maxhp < .3) d *= .9;
    return Math.max(1, Math.round(d));
  }
  async function act(f, o, a){
    const my = f === me, cls = my ? 'my' : '', nm = f.name;
    f.open = 1; f.guard = false; f.counter = false;
    if(a === 'charm'){ await logLine(`${nm}は うっとりして 動けない！`, cls); return; }
    if(a === 'guard'){ f.guard = true; f.lastGuard = true; const h = Math.round(f.maxhp * f.heal); f.hp = Math.min(f.maxhp, f.hp + h); drawHp(f); await logLine(`${nm}は ふんばった！ HPが${h}かいふく`, cls); return; }
    f.lastGuard = false;
    const mv = a === 'sp' ? (f.moves[1] || f.moves[0]) : null;
    fx(f, 'act');
    if(mv){
      await logLine(`${nm}の ${mv.name}！`, cls);
      f.open = mv.open;
      if(mv.heal){ const h = Math.round(f.maxhp*mv.heal); f.hp = Math.min(f.maxhp, f.hp + h); drawHp(f); await logLine(`${nm}の HPが${h}かいふくした`, cls); return; }
      if(mv.counter){ f.guard = true; f.counter = true; }
      const hits = mv.hits || 1; let any = false;
      for(let i=0;i<hits;i++){
        const acc = mv.acc * (f.blind > 0 ? .5 : 1); if(f.blind > 0) f.blind--;
        if(Math.random() > acc){ await logLine(`…${o.name}は ひらりとかわした！`); continue; }
        if(mv.mult > 0){ const d = dmg(f, o, mv.mult, mv.pierce); o.hp -= d; drawHp(o); fx(o, 'hit'); any = true; await logLine(`${o.name}の HPが${d}へった！`, cls); }
        if(o.hp <= 0) return;
      }
      if(any || mv.mult === 0){
        if(mv.blind){ o.blind = mv.blind; await logLine(`${o.name}は 目がくらんで、攻撃が当たりにくくなった`, cls); }
        if(mv.weaken){ o.weak = Math.min(o.weak, mv.weaken); await logLine(`${o.name}の ちからが下がった`, cls); }
        if(mv.charm){ o.charm = mv.charm; await logLine(`${o.name}は うっとりした！`, cls); }
      }
      if(mv.counter) await logLine(`${nm}は ふんばりながら かまえている`, cls);
      return;
    }
    const acc = .9 * (f.blind > 0 ? .5 : 1); if(f.blind > 0) f.blind--;
    await logLine(`${nm}の つっこみ！`, cls);
    if(Math.random() > acc){ await logLine(`…${o.name}は ひらりとかわした！`); return; }
    const d = dmg(f, o, 1, false); o.hp -= d; drawHp(o); fx(o, 'hit'); await logLine(`${o.name}の HPが${d}へった！`, cls);
    if(o.counter && o.hp > 0){ const cd = Math.round(dmg(o, f, .6, false)); f.hp -= cd; drawHp(f); fx(f, 'hit'); await logLine(`${o.name}の はんげき！ ${nm}の HPが${cd}へった`, my ? '' : 'my'); }
  }
  await logLine(`${me.name} 対 ${op.name}！ はっけよい、のこった！`, 'ko');
  let round = 0, winner = null;
  while(round++ < 30){
    if(cheer > 0 && round === 2){ const k = c.pers === 'hitonatsu' ? .08 : .04; me.atk *= 1 + k*Math.min(cheer, 3); await logLine(`おうえんで ${me.name}は はりきっている！`, 'my'); }
    const am = choose(me, op), ao = choose(op, me);
    const mf = am === 'sp' && me.moves[1] && me.moves[1].first, of = ao === 'sp' && op.moves[1] && op.moves[1].first;
    const first = mf !== of ? (mf ? me : op) : (me.spd === op.spd ? (Math.random() < .5 ? me : op) : (me.spd > op.spd ? me : op));
    const order = first === me ? [[me, op, am], [op, me, ao]] : [[op, me, ao], [me, op, am]];
    for(const [f, o, a] of order){ if(f.hp <= 0) continue; await act(f, o, a); if(o.hp <= 0){ winner = f; break; } }
    if(winner) break;
  }
  if(!winner) winner = me.hp/me.maxhp >= op.hp/op.maxhp ? me : op;
  const won = winner === me, loser = won ? op : me;
  $('f-' + (loser === me ? 'l' : 'r')).classList.add('down');
  await logLine(won ? `${op.name}は 土俵の外へ！ ${me.name}の勝ち！` : `${me.name}は 土俵の外へ… ${op.name}の勝ち。`, 'ko');
  await wait(fast ? 300 : 1200);
  const ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn pri'; ok.textContent = 'つぎへ'; A.querySelector('.ctl').innerHTML = ''; A.querySelector('.ctl').appendChild(ok);
  await new Promise(r=> ok.onclick = r); A.remove();
  // 結果：勝因・敗因を育て方にむすびつける
  const first = !S.sumo[r.key];
  if(won){ S.stats.wins++; S.sumo[r.key] = dayKey(); const m = first ? r.money : SUMO_REWIN; S.money += m; if(r.key === 'ren') S.sumoChamp = true;
    await say(`${r.short}「${r.win}」\nどんぐり ${dg(m)} をもらった！${first && r.key === 'ren' ? '\n【チャンピオン】きみの虫が、宗像でいちばん強い！' : ''}`); }
  else { S.stats.loses++; if(c.pers !== 'makezu' && Math.random() < .3){ c.pers = 'makezu'; await say(`${r.short}「${r.lose}」\n${me.name}は、くやしそうに相手をにらんでいる…。性格が「まけずぎらい」になった！`); } else await say(`${r.short}「${r.lose}」`); }
  save();
  const cmp = {atk:me.atk/op.atk, hp:me.maxhp/op.maxhp, spd:(me.spd+1)/(op.spd+1), def:op.def/me.def, heal:me.heal/op.heal};
  const keys = Object.keys(cmp).sort((a,b)=>cmp[a]-cmp[b]), low = keys[0], high = keys[keys.length-1];
  const NAMES = {atk:'ちから', hp:'たいりょく', spd:'すばやさ', def:'まもり', heal:'かいふく'};
  const HINT = {atk:'エサをたっぷりあげると、ちからがつく', hp:'毎日かかさず世話すると、たいりょくがつく', spd:'広いケースで育てると、すばやくなる', def:'ベランダの日かげで育てると、まもりが強くなる', heal:'げんかんの静かな場所で、こまめにそうじすると、かいふくがよくなる'};
  if(won) await say(`【勝因】${me.name}は、相手より「${NAMES[high]}」が高かった。\n育て方が、ちゃんと虫に出ている！`);
  else await say(`【敗因】${me.name}は、相手より「${NAMES[low]}」が足りなかった。\n【ヒント】${HINT[low]}。\n${BUGS[c.bug].rank < BUGS[r.bug].rank ? 'もっとめずらしい虫を育てるのも、ひとつの手。' : '次の虫で、ためしてみよう。'}`);
  refresh();
}

    <p class="small">ホーム画面のアイコンから開くと、アプリのように全画面で遊べます。</p>`);
}

/* キーボード：Esc／X で とじる・もどる（虫とり日記の B ボタンと同じ） */
addEventListener('keydown', e=>{
  if(e.key !== 'Escape' && e.key.toLowerCase() !== 'x') return;
  const ful = [...document.querySelectorAll('.full')].pop(); if(ful){ ful.remove(); return; }
  const msg = $('msgLayer'); if(msg && !msg.querySelector('.ans')){ msg.click(); return; }
  if(openCase !== null){ openCase = null; render(); }
});

/* 起動 */
render();
setInterval(()=>{ if(S && !$('msgLayer') && !$('evLayer')){ tickAll(); hud(); if(openCase === null && tab === 'home') render(); } }, 60*1000);   // 1分ごとに、おなかなどをへらす
</script>
</html>
