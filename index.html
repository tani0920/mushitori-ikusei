<html lang="ja">

}

<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">

<script>
// アイコンを作り直したら ICON_VER を変える（iPhone・iPad が古いアイコンを覚えたままにならないように）
(function(){
  var ICON_VER = '1' + (window.DEMO ? '-demo' : '');
  document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"],link[rel="manifest"]').forEach(function(l){ l.href = l.getAttribute('href') + '?v=' + ICON_VER; });

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 見た目は「むなかた虫とり日記」の家族：森のフレーム＋RPGウィンドウ。こちらは昼の飼育ケースなので、少し明るい苔色 */
:root{
  --frame:#1e2f24;      /* 苔の森 */
  --frame-2:#2b4233;
  --ink:#f7f1df;
  --win:#14284a;
  --edge:#f7f1df;
  --sun:#f4b63c;
  --ok:#5ccf6a;
  --low:#e8553e;
  --paper:#f3ead2;
  --paper-ink:#2c2418;
  --paper-line:#d8c9a3;
  --mute:#a9bba9;
  --f-pixel:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{min-height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--f-pixel);line-height:1.6;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
#app{max-width:680px;margin:0 auto;padding-block:8px 12px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:400;letter-spacing:.08em;color:var(--sun)}
header small{color:var(--mute);font-size:12px}
#hud{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;align-items:center;font-variant-numeric:tabular-nums;min-height:22px}
#hud .money{color:var(--sun)}
#hud .slot{display:inline-flex;align-items:center;gap:.3em}
ruby.fr rt{font-size:.5em;letter-spacing:0;font-weight:400;opacity:.9}
.win{background:var(--win);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--win);color:var(--ink);padding:.6em .9em;line-height:1.6}
.btn{font:inherit;background:var(--win);color:var(--ink);border:2px solid var(--edge);border-radius:8px;padding:.45em 1em;cursor:pointer;box-shadow:0 2px 0 #0006}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.pri{background:var(--sun);color:#1b130c;border-color:var(--sun)}
.btn.sub{background:#ffffff18}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.small{font-size:12px;color:var(--mute)}
h2{margin:.2em 0;font-weight:400;font-size:18px;letter-spacing:.08em;color:var(--sun)}
h3{margin:.6em 0 .2em;font-weight:400;font-size:15px;letter-spacing:.06em;color:#fff;border-bottom:1px solid #f7f1df44}
p{margin:.3em 0}

/* タイトル */
#titleScr{position:relative;min-height:calc(100dvh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center;
  background:linear-gradient(#5aa6d8 0%,#a9d7ea 45%,#6c9a4a 46%,#4e7a36 70%,#5a3d22 71%,#3b2715 100%);border:4px solid var(--frame-2);border-radius:8px;overflow:hidden;padding:5% 4% 4%}
#titleScr .t1{font-size:clamp(13px,3.5vw,20px);color:#fff;letter-spacing:.2em;text-shadow:2px 2px 0 #0008}
#titleScr .t2{font-size:clamp(30px,9vw,56px);color:var(--sun);letter-spacing:.06em;text-shadow:3px 3px 0 #5a2a10,-1px -1px 0 #fff3;line-height:1.15;margin:.1em 0}
#titleScr .t3{font-size:clamp(11px,2.8vw,15px);color:#fff;text-shadow:1px 1px 0 #0009;max-width:30em}
#titleScr .t4{max-width:34em;margin-top:.6em;padding:.35em .8em;font-size:clamp(9px,2.1vw,12px);line-height:1.5;color:#fff;background:#0006;border-radius:4px}
#titleScr .sun{position:absolute;right:9%;top:7%;width:12%;max-width:70px;aspect-ratio:1;border-radius:50%;background:#ffe27a;box-shadow:0 0 0 6px #ffe27a44}
#titleScr .hero{width:min(60%,260px);margin:.3em 0}
#titleScr .tbtns{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;margin-top:.7em}
#titleScr .tbtn{font:inherit;font-size:clamp(13px,3vw,17px);color:#fff;background:#14284acc;border:2px solid #f7f1df;border-radius:999px;padding:.4em 1.2em;cursor:pointer;box-shadow:0 2px 0 #0006}
#titleScr .tbtn.pri{background:var(--sun);color:#1b130c;border-color:#fff}
#titleScr .vrow{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin-top:.6em}
#titleScr .verbtn{font-family:var(--f-pixel);font-size:clamp(9px,2vw,13px);letter-spacing:.04em;color:#fff;background:#14284a99;border:1px solid #f7f1dfaa;border-radius:999px;padding:.2em .8em;cursor:pointer;text-shadow:1px 1px 0 #000}
#titleScr .credit{position:absolute;right:.8em;top:.6em;font-size:clamp(9px,1.9vw,12px);letter-spacing:.06em;color:#fff;opacity:.92;text-shadow:1px 1px 0 #000;pointer-events:none}

/* 下のタブ（スマホで親指がとどく場所） */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:6px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:#14284aee;border-top:2px solid var(--edge)}
#tabs button{font:inherit;flex:1;max-width:150px;font-size:14px;color:var(--ink);background:transparent;border:2px solid #f7f1df55;border-radius:10px;padding:.5em .2em;cursor:pointer;line-height:1.2}
#tabs button .ic{display:block;font-size:20px;line-height:1.1}
#tabs button.on{background:var(--sun);color:#1b130c;border-color:var(--sun)}
#tabs button .badge{position:absolute;transform:translate(.4em,-1.4em);background:var(--low);color:#fff;font-size:10px;border-radius:999px;padding:0 .45em}
#tabs button{position:relative}

/* おうち：飼育ケースの一覧 */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.case{background:var(--win);border:3px solid var(--edge);border-radius:8px;padding:.5em;cursor:pointer;display:flex;flex-direction:column;gap:.3em;box-shadow:0 0 0 2px var(--win)}
.case.empty{opacity:.75;border-style:dashed;justify-content:center;align-items:center;min-height:180px;color:var(--mute)}
.case .pic{height:110px;border-radius:6px;overflow:hidden;position:relative}
.case .pic svg{width:100%;height:100%}
.case .nm{font-size:15px;color:#fff}
.case .st{font-size:12px;color:var(--mute)}
.case .alert{position:absolute;right:4px;top:4px;background:var(--low);color:#fff;font-size:11px;border-radius:999px;padding:0 .5em}
.case .ev{position:absolute;left:4px;top:4px;background:var(--sun);color:#1b130c;font-size:11px;border-radius:999px;padding:0 .5em;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.meters{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;align-items:center}
.bar{display:block;width:100%;height:9px;background:#0006;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.bar i.mid{background:var(--sun)}
.bar i.low{background:var(--low)}

/* 観察（ケースの断面） */
#obs .scene{position:relative;width:100%;aspect-ratio:4/3;border:4px solid var(--frame-2);border-radius:8px;overflow:hidden;background:#000}
#obs .scene svg{width:100%;height:100%;display:block}
#obs .obsTxt{margin-top:6px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.acts .btn{padding:.6em .4em;font-size:14px;line-height:1.3}
.acts .btn small{display:block;font-size:11px;color:var(--mute)}
.acts .btn.pri small{color:#1b130c99}

/* そと */
.spots{display:grid;gap:8px}
.spot{background:var(--win);border:3px solid var(--edge);border-radius:8px;padding:.5em .8em;box-shadow:0 0 0 2px var(--win)}
.spot b{color:var(--sun);font-weight:400}
.spot .bugs{font-size:12px;color:var(--mute)}
.spot.here{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.found{display:flex;flex-direction:column;align-items:center;gap:.4em;padding:.6em}
.found .pic{width:min(60%,220px);aspect-ratio:1}
.found .pic svg{width:100%;height:100%}
.found .ex{position:absolute;font-size:40px;color:var(--sun);text-shadow:2px 2px 0 #000;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.search{text-align:center;padding:1em}
.search .dots::after{content:'…';animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:''}33%{content:'・'}66%{content:'・・'}100%{content:'・・・'}}

/* ずかん */
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.dexGrid .d{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:.4em;text-align:center;cursor:pointer;border:2px solid var(--paper-line);font-size:12px}
.dexGrid .d svg{width:100%;aspect-ratio:1}
.dexGrid .d.no{opacity:.6}
.dexGrid .d .mk{display:block;color:#7a5a20}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:.8em 1em;line-height:1.7}
.paper h3{color:#5a3a10;border-color:var(--paper-line)}
.paper .pic{width:min(50%,200px);aspect-ratio:1;margin:0 auto}
.paper .pic svg{width:100%;height:100%}
.paper table{border-collapse:collapse;font-size:13px;width:100%}
.paper td{border-bottom:1px solid var(--paper-line);padding:.25em .3em;vertical-align:top}
.paper td:first-child{white-space:nowrap;color:#7a5a20}

/* 全画面パネル（ずかん・説明など）：「とじる」はいつも右下 */
.full{position:fixed;inset:0;z-index:100;overflow-y:auto;background:var(--frame);
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.full .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.full .top{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid #f7f1df55;padding-bottom:6px}
.full .top h2{margin:0}
.full .close{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:101;font-size:17px;padding:.55em 1.5em;box-shadow:0 3px 0 #0006,0 0 0 2px var(--frame)}
.chlog h3{margin:.8em 0 .2em}
.chlog .now{font-size:11px;background:var(--sun);color:#1b130c;border-radius:999px;padding:0 .5em;margin-left:.5em}
.chlog ul{margin:.2em 0 .6em;padding-left:1.3em;font-size:13px}
.chlog li{margin:.15em 0}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
.opt .btn span.v{color:var(--sun)}
.demoBox{border:2px dashed var(--low);border-radius:8px;padding:.6em .8em}
.demoBox h3{color:var(--low);border:0}

/* メッセージ（RPGの窓） */
#msgLayer{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#0005}
#msgLayer .win{width:min(100%,600px);font-size:16px;cursor:pointer;white-space:pre-line}
#msgLayer .win .tap{display:block;text-align:right;font-size:12px;color:var(--mute);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#msgLayer .win .ans{display:flex;flex-direction:column;gap:.4em;margin-top:.6em}
#msgLayer .yk{color:var(--sun)}

/* 新しい版のお知らせ（虫とり日記と同じ） */
.updBar{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:10000;display:flex;align-items:center;justify-content:center;gap:.6em;white-space:nowrap;background:#14284af0;color:#fff;border:2px solid var(--sun);border-radius:10px;padding:.4em .5em .4em .9em;box-shadow:0 4px 12px #0008;font-size:13px}
.updBar button{font:inherit;background:var(--sun);color:#1b130c;border:0;border-radius:6px;padding:.35em .8em;cursor:pointer;white-space:nowrap}
.updAsk{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:#0008;padding:16px}
.updAsk .box{background:#14284a;color:#fff;border:2px solid var(--sun);border-radius:12px;padding:1em 1.1em;max-width:22em;font-size:15px;line-height:1.7;box-shadow:0 6px 18px #000a}
.updAsk .box b{color:var(--sun)}
.updAsk .row{display:flex;flex-direction:column;gap:.5em;margin-top:.9em}
.updAsk button{font:inherit;border:0;border-radius:8px;padding:.6em .8em;cursor:pointer}
.updAsk .go{background:var(--sun);color:#1b130c}
.updAsk .later{background:#ffffff22;color:#fff}
.demoBadge{position:fixed;right:env(safe-area-inset-right,0px);top:env(safe-area-inset-top,0px);z-index:9999;background:#c0392b;color:#fff;font-size:10px;letter-spacing:.1em;padding:1px 7px;border-radius:0 0 0 6px;opacity:.9;pointer-events:none}
.saveMark{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:#0009;color:#fff;font-size:11px;border-radius:999px;padding:.1em .8em;opacity:0;transition:opacity .3s;pointer-events:none}
.saveMark.on{opacity:1}

/* 虫のアニメーション（パーツ分けした2D：はね・足・体のふしを動かす） */
.bug *{transform-box:fill-box;transform-origin:center}
.bug .wing{transform-origin:right center;animation:flap 1.1s ease-in-out infinite}
.bug .wing.r{animation-delay:-.0s}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
.bug.rest .wing{animation:none;transform:scaleX(.12)}
.bug.sil{filter:brightness(0) opacity(.45)}
.bug .seg{animation:wig 1s ease-in-out infinite}
.bug .seg:nth-child(even){animation-delay:-.5s}
@keyframes wig{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.bug .leg{transform-origin:top center;animation:step .5s ease-in-out infinite alternate}
.bug .leg.b{animation-delay:-.25s}
@keyframes step{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.bug .ant{transform-origin:bottom center;animation:ant 2.4s ease-in-out infinite}
.bug .ant.r{animation-delay:-1.2s}
@keyframes ant{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.bug .grub{animation:grub 2.4s ease-in-out infinite}
@keyframes grub{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bug .pupa{animation:breath 3s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.bug .glow{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.15}50%{opacity:1}}
.bug .hop{animation:hop 3.2s ease-in-out infinite}
@keyframes hop{0%,80%,100%{transform:translateY(0)}87%{transform:translateY(-6px)}94%{transform:translateY(0)}}
.bug.sleep *{animation:none!important}
.bug.sleep .body{animation:breath 4s ease-in-out infinite!important}
.note{animation:note 1.6s linear infinite;opacity:0}
.note.b{animation-delay:-.8s}
@keyframes note{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(6px,-22px);opacity:0}}
.zz{animation:zz 2.4s linear infinite;opacity:0}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(4px,-16px);opacity:0}}

/* 成長イベントの演出 */
#evLayer{position:fixed;inset:0;z-index:150;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#evLayer .stage{position:relative;width:min(80vw,320px);aspect-ratio:1}
#evLayer .stage .ly{position:absolute;inset:0}
#evLayer .stage svg{width:100%;height:100%}
#evLayer .ttl{font-size:clamp(20px,6vw,32px);color:var(--sun);text-shadow:2px 2px 0 #5a2a10;letter-spacing:.1em;animation:pop .6s}
#evLayer .cap{color:#fff;font-size:15px;text-align:center;white-space:pre-line}
.ev-old{animation:evOld 2.4s ease-in forwards}
@keyframes evOld{0%{opacity:1;transform:scale(1)}60%{opacity:.9;transform:scale(1.04)}100%{opacity:0;transform:translateY(18px) scale(.9)}}
.ev-new{animation:evNew 2.6s ease-out forwards;opacity:0}
@keyframes evNew{0%{opacity:0;transform:scale(.6)}55%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.ev-crack{animation:evCrack 2.2s ease-in forwards}
@keyframes evCrack{0%{opacity:1;transform:scaleY(1)}40%{transform:scaleY(1.06) rotate(-2deg)}70%{opacity:1;transform:scaleY(.9) rotate(2deg)}100%{opacity:0;transform:scaleY(.6)}}
.ev-emerge .wing{animation:unfold 2.2s 1.6s ease-out forwards;transform:scaleX(.05)}
@keyframes unfold{0%{transform:scaleX(.05)}60%{transform:scaleX(1.05)}100%{transform:scaleX(1)}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffe27a;animation:spark 1.6s ease-out infinite;opacity:0}
@keyframes spark{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.2)}}

@media (min-width:600px){ #tabs button{font-size:15px} }
</style>

<div id="app">
  <header><h1>むなかた虫そだて</h1><small>デモ <span class="gver"></span></small></header>
  <div id="hud" hidden></div>
  <div id="view"></div>
</div>
<div id="tabs" hidden>
  <button type="button" data-t="home"><span class="ic">🏠</span>おうち</button>
  <button type="button" data-t="out"><span class="ic">🌳</span>そと</button>
  <button type="button" data-t="dex"><span class="ic">📖</span>ずかん</button>
  <button type="button" data-t="opt"><span class="ic">⚙</span>オプション</button>
</div>
<div class="saveMark" id="saveMark">セーブしました</div>

<script>
'use strict';
/* =========================================================
   設定（ここをいじるとバランス調整できる）
   ========================================================= */
const CASES = 3;                 // 飼育ケースの数
const FINDS_PER_VISIT = 3;       // 1日に1つの場所でさがせる回数
const HUNGER_H = 48, WET_H = 60, CLEAN_H = 96;   // 満タンから0になるまでの時間（時間）
const WEAK_H = 72;               // 元気がとても低いまま、この時間がたつと、虫は自然にかえる
const KEY_PRE = window.DEMO ? 'demo-' : '';   // デモ版は本番のセーブにさわらない
const SAVE_KEY = KEY_PRE + 'munakata-mushisodate-v1';
const QS = new URLSearchParams(location.search);

/* バージョンとこうしん情報：公開するたびに番号を上げる（ふだんは +0.0.1、大きなこうしんは +0.1） */
const GAME_VER = '0.1.0';
const BUILD = '20261023-2050';   // 公開するたびに tools/bump.sh が日時を書きこむ（version.json と同じ値）

/* =========================================================
   新しい版が公開されていたら知らせる（ホーム画面のアプリは古いページを覚えたままになりやすいので）
   アプリを開いたときと、ほかのアプリからもどってきたときに version.json を見にいく
   ========================================================= */
let updShown = false;
async function checkUpdate(){
  if(BUILD === 'dev' || updShown) return;
  try{
    const j = await (await fetch('version.json?t=' + Date.now(), {cache:'no-store'})).json();
    if(!j.build || j.build === BUILD) return;
    updShown = true;
    const b = document.createElement('div'); b.className = 'updBar';
    b.innerHTML = `<span>新しいバージョンがあります</span><button type="button">こうしんする</button>`;
    const go = ()=> location.replace(location.pathname + '?u=' + encodeURIComponent(j.build));
    b.querySelector('button').onclick = ()=>{
      if(!S){ go(); return; }   // タイトル画面なら、消えるものはない
      const a = document.createElement('div'); a.className = 'updAsk';
      a.innerHTML = `<div class="box"><b>セーブをわすれずに！</b><br>こうしんすると、ページを読みこみなおします。<br>いまのようすをセーブしてから、こうしんしますか？<div class="row"><button type="button" class="go">セーブして、こうしんする</button><button type="button" class="later">あとで</button></div></div>`;
      a.querySelector('.go').onclick = ()=>{ save(); go(); };
      a.querySelector('.later').onclick = ()=> a.remove();
      document.body.appendChild(a);
    };
    document.body.appendChild(b);
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible'){ checkUpdate(); if(S) refresh(); } });

const FURI_KEY = KEY_PRE + 'munakata-furigana-v1';   // 虫とり日記と同じキー名にしているので、どちらかで切りかえると両方にきく
let furiMode = (()=>{ try{ return localStorage.getItem(FURI_KEY) === '1'; }catch(e){ return false; } })();
let rubyMap = {}, rubyRe = null;
function buildRuby(){
  const min = furiMode ? 3 : 5; rubyMap = {};
  for(const w in RUBY){ const [rd, g] = RUBY[w].split('|'); if(+g >= min) rubyMap[w] = rd; }
  const keys = Object.keys(rubyMap).sort((a,b)=>b.length - a.length);
  rubyRe = keys.length ? new RegExp(keys.join('|'), 'g') : null;
}
const isKana = c=> /[぀-ゟ]/.test(c);
function rubyNode(w){   // 送りがななど、ことばの前後のひらがなにはふりがなを付けない
  const rd = rubyMap[w]; let pre = 0, suf = 0;
  while(pre < w.length && isKana(w[pre]) && rd[pre] === w[pre]) pre++;
  while(suf < w.length - pre && isKana(w[w.length-1-suf]) && rd[rd.length-1-suf] === w[w.length-1-suf]) suf++;
  const f = document.createDocumentFragment();
  if(pre) f.appendChild(document.createTextNode(w.slice(0, pre)));
  const r = document.createElement('ruby'); r.className = 'fr';
  r.appendChild(document.createTextNode(w.slice(pre, w.length - suf)));
  const rt = document.createElement('rt'); rt.textContent = rd.slice(pre, rd.length - suf); r.appendChild(rt);
  f.appendChild(r);
  if(suf) f.appendChild(document.createTextNode(w.slice(w.length - suf)));
  return f;
}
function rubifyText(t){
  const p = t.parentNode;
  if(!rubyRe || !p || p.nodeType !== 1 || p.closest('ruby,script,style,svg,textarea,title,.norb')) return;
  const v = t.nodeValue; rubyRe.lastIndex = 0;
  if(!rubyRe.test(v)) return;
  rubyRe.lastIndex = 0;
  const f = document.createDocumentFragment(); let last = 0, m;
  while((m = rubyRe.exec(v))){
    if(m.index > last) f.appendChild(document.createTextNode(v.slice(last, m.index)));
    f.appendChild(rubyNode(m[0])); last = m.index + m[0].length;
  }
  if(last < v.length) f.appendChild(document.createTextNode(v.slice(last)));
  p.replaceChild(f, t);
}
function rubify(root){
  if(root.nodeType === 3){ rubifyText(root); return; }
  if(root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  while(w.nextNode()) list.push(w.currentNode);
  list.forEach(rubifyText);
}
function setFuri(on){
  furiMode = on; try{ on ? localStorage.setItem(FURI_KEY, '1') : localStorage.removeItem(FURI_KEY); }catch(e){}
  document.querySelectorAll('ruby.fr').forEach(r=> r.replaceWith(document.createTextNode(r.firstChild.nodeValue)));
  document.body.normalize(); buildRuby(); rubify(document.body);
}
const furiLabel = ()=> 'ふりがな：' + (furiMode ? 'たくさん' : 'ふつう');
buildRuby();
new MutationObserver(ms=>{ for(const m of ms){ if(m.type === 'characterData') rubifyText(m.target); else m.addedNodes.forEach(rubify); } })
  .observe(document.body, {childList:true, subtree:true, characterData:true});
rubify(document.body);

function distM(a, b, c, d){ const R = 6371000, r = Math.PI/180, x = (d-b)*r*Math.cos((a+c)/2*r), y = (c-a)*r; return Math.hypot(x, y) * R; }
function nearSpot(lat, lon){
  let best = null;
  for(const sp of SPOTS) for(const [a, b, rad] of sp.pts){ const k = distM(lat, lon, a, b) / rad; if(k <= 1 && (!best || k < best.k)) best = {sp, k}; }
  return best && best.sp;
}
function getPos(){
  const t = QS.get('geo');   // 画面確認用：?geo=緯度,経度
  if(t){ const [a, b] = t.split(',').map(Number); return Promise.resolve({lat:a, lon:b}); }
  return new Promise((res, rej)=>{
    if(!navigator.geolocation) return rej(new Error('none'));
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude, lon:p.coords.longitude}), rej, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
  });
}

   ========================================================= */
let S = null;

}
function save(){ if(QS.has('demo')) return;   // 確認用のURL（?demo=…）で遊んだときは、ほんとうのセーブを上書きしない
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); const m = $('saveMark'); m.classList.add('on'); setTimeout(()=>m.classList.remove('on'), 900); }catch(e){} }
function load(){ try{ const j = JSON.parse(localStorage.getItem(SAVE_KEY)); return j && j.v ? j : null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
const AUTO_KEY = 'munakata-autosave-v1';
let autoSave = (()=>{ try{ return localStorage.getItem(AUTO_KEY) !== 'off'; }catch(e){ return true; } })();   // はじめは ON
function setAutoSave(on){ autoSave = on; try{ localStorage.setItem(AUTO_KEY, on ? 'on' : 'off'); }catch(e){} }
function autoSaveNow(){ if(!autoSave || !S) return; save(); }

/* =========================================================
   成長の計算
   虫ごとに、おなか・しめりけ・きれいさ が時間とともにへる。3つの平均が「元気」。
   元気が高いと育ちが進み、低いと止まる。元気がとても低いままだと、虫は自然にかえる（死なせない。でも、お世話しないとさよならになる）
   すがたがかわるタイミングは「次にケースをのぞいたとき」にアニメーションで見せる（pending）
   ========================================================= */
function stageOf(c){ return BUGS[c.bug].plan[c.si]; }
function genkiOf(c){ const st = stageOf(c); return Math.round(st.k === 'pupa' ? (c.wet*2 + c.clean)/3 : (c.hunger + c.wet + c.clean)/3); }
function tickCase(c){
  const t = now(); let h = (t - c.tick) / H; if(h <= 0) return; if(h > 24*60) h = 24*60;
  c.tick = t;
  const st = stageOf(c);
  // 1時間ずつ進める（長いあいだ放っておいたときも、順番どおりに計算する）
  let left = h;
  while(left > 0){
    const d = Math.min(1, left); left -= d;
    if(st.k !== 'pupa') c.hunger = clamp(c.hunger - 100/HUNGER_H*d, 0, 100);
    c.wet = clamp(c.wet - 100/WET_H*d, 0, 100);
    c.clean = clamp(c.clean - 100/CLEAN_H*d, 0, 100);
    const g = genkiOf(c);
    if(!c.pending){ const sp = g >= 60 ? 1 : g >= 30 ? .5 : 0; c.prog += d*sp; if(c.prog >= st.days*24){ c.prog = st.days*24; c.pending = true; } }
    if(g < 15){ c.weak = (c.weak||0) + d; if(c.weak >= WEAK_H && !c.gone) c.gone = true; } else c.weak = 0;
  }
}
function tickAll(){ if(!S) return; S.cases.forEach(c=>{ if(c) tickCase(c); }); }
const meterCls = v=> v < 30 ? 'low' : v < 60 ? 'mid' : '';
const stageLabel = c=>{ const st = stageOf(c); const n = BUGS[c.bug].plan.slice(0, c.si).filter(s=>s.k==='larva').length; return st.k === 'larva' && n ? `${STAGE_NAME.larva}・${n+1}回目` : STAGE_NAME[st.k]; };
const daysLeft = c=> Math.max(0, Math.ceil((stageOf(c).days*24 - c.prog)/24));
const needs = c=>{ const st = stageOf(c), a = []; if(st.k !== 'pupa' && c.hunger < 40) a.push('おなか'); if(c.wet < 40) a.push('しめりけ'); if(c.clean < 40) a.push('そうじ'); return a; };

  return `<svg class="${cls}" viewBox="0 0 100 100" aria-label="${esc(b.name)}の${esc(STAGE_NAME[stage]||'')}"><g transform="translate(50 50) scale(${sc}) translate(-50 -50)">${inner}</g></svg>`;
}

function placeBug(c, slot){   // どこに、どんなすがたでいるか
  const b = BUGS[c.bug], st = stageOf(c).k, night = slot === 'yoru', day = slot === 'hiru' || slot === 'asa';

    if(st === 'pupa') return {x:70, y:26, s:.4, o:{}, txt:'葉のうらに、糸でぶらさがっている。中では体が作りかえられているところ。'};

}
function sceneSVG(c, slot){
  const b = BUGS[c.bug], st = stageOf(c).k, soilKind = b.kind === 'beetle' || b.kind === 'stag', [s1, s2] = SKY[slot], p = placeBug(c, slot);
  const stars = slot === 'yoru' ? [[10,8],[30,14],[55,6],[80,12],[92,20],[68,18]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r=".6" fill="#fff"/>`).join('') : '';
  const sun = slot === 'yoru' ? `<circle cx="84" cy="14" r="5" fill="#fff6c0"/>` : slot === 'yu' ? `<circle cx="84" cy="22" r="6" fill="#ff8040"/>` : `<circle cx="84" cy="12" r="6" fill="#ffe27a"/>`;
  const soilTop = soilKind ? 52 : 70;
  let plants = '';
  if(b.kind === 'butterfly') plants = `<path d="M40 ${soilTop} C 42 50, 44 40, 50 22" stroke="#4e7a36" stroke-width="2.5" fill="none"/>
      <path d="M50 30 C 62 20, 76 24, 70 36 C 62 40, 54 36, 50 30Z" fill="#6cb04a"/><path d="M46 44 C 34 36, 26 40, 30 50 C 38 52, 44 50, 46 44Z" fill="#5a9a3a"/>
      <circle cx="52" cy="22" r="5" fill="#f4b63c"/><circle cx="52" cy="22" r="2" fill="#a85a28"/>`;
  else if(soilKind) plants = `<path d="M20 50 L36 32 L72 32 L80 50 Z" fill="#6a4a2a"/><path d="M36 32 L72 32 L68 36 L40 36 Z" fill="#8a6a3a"/><path d="M26 44 L30 40 M60 40 L64 36" stroke="#4a3a2a" stroke-width="1"/>
      <rect x="72" y="42" width="12" height="9" rx="2" fill="#e8c060" stroke="#a85a28" stroke-width="1"/>`;
  else plants = [12,22,30,62,72,84,92].map((x,i)=>`<path d="M${x} ${soilTop} C ${x+2} ${soilTop-14}, ${x-4} ${soilTop-22}, ${x+(i%2?3:-2)} ${soilTop-30}" stroke="#5a9a3a" stroke-width="2" fill="none"/>`).join('') +
      (b.kind === 'cricket' ? `<path d="M14 ${soilTop} L22 ${soilTop-12} L40 ${soilTop-12} L44 ${soilTop} Z" fill="#8a6a3a"/>` : '');
  const chamber = p.chamber ? `<ellipse cx="${p.x+10}" cy="${p.y+2}" rx="17" ry="12" fill="#2a1a0a"/>` : '';
  const soil = `<rect x="0" y="${soilTop}" width="100" height="${100-soilTop}" fill="#5a3d22"/><rect x="0" y="${soilTop}" width="100" height="2" fill="#6c9a4a"/>
    ${[[8,80],[24,90],[48,84],[70,78],[88,92],[36,74],[60,94]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4" fill="#3b2715"/>`).join('')}`;
  const bug = `<g transform="translate(${p.x} ${p.y}) scale(${p.s*1.2}) translate(-50 -50)" style="${p.buried ? 'opacity:.55' : ''}">${svgBug(c.bug, st, p.o).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</g>`;
  // ガラスのケースのわく
  const glass = `<rect x="1" y="1" width="98" height="98" fill="none" stroke="#f7f1df88" stroke-width="2" rx="2"/><path d="M4 4 L4 30" stroke="#fff" stroke-width="1" opacity=".5"/>`;
  const zz = p.o && p.o.sleep ? `<text class="zz" x="${p.x+8}" y="${p.y-8}" font-size="7" fill="#fff">z</text><text class="zz" x="${p.x+13}" y="${p.y-14}" font-size="5" fill="#fff" style="animation-delay:-1.2s">z</text>` : '';
  return {svg:`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient></defs>
    <rect width="100" height="100" fill="url(#sky)"/>${stars}${sun}${soil}${chamber}${plants}${bug}${zz}${glass}</svg>`, txt:p.txt};
}

/* =========================================================
   メッセージ（RPGの窓。タップで次へ）
   ========================================================= */
function say(text, opts={}){
  return new Promise(res=>{
    const L = document.createElement('div'); L.id = 'msgLayer';
    const w = document.createElement('div'); w.className = 'win';
    w.innerHTML = fmtMsg(text) + (opts.ans ? '' : '<span class="tap">▼ タップでつぎへ</span>');
    if(opts.ans){ const a = document.createElement('div'); a.className = 'ans';
      opts.ans.forEach((t,i)=>{ const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (i===0 ? ' pri' : ''); b.textContent = t; b.onclick = e=>{ e.stopPropagation(); L.remove(); res(i); }; a.appendChild(b); });
      w.appendChild(a);
    } else { L.onclick = ()=>{ L.remove(); res(0); }; }
    L.appendChild(w); document.body.appendChild(L);
  });
}
const fmtMsg = t=> esc(t).replace(/【([^】]+)】/g, '<b class="yk">【$1】</b>').replace(/\n/g, '<br>');
const ask = (text, yes='はい', no='いいえ')=> say(text, {ans:[yes, no]}).then(i=> i === 0);
// そだてのやくそく：はじめての場面で、ひとことずつ教える
async function yakusoku(key, text){ if(S.yk[key]) return; S.yk[key] = 1; await say('【そだてのやくそく】\n' + text); }

  view.innerHTML = `<div class="row" style="justify-content:space-between"><h2>${esc(b.name)}の${stageLabel(c)}</h2><button type="button" class="btn sub" id="btnBack">もどる</button></div>
    <div id="obs"><div class="scene">${sc.svg}</div><div class="obsTxt win">${esc(sc.txt)}${c.pending ? '<br><b class="yk">…なんだか、ようすがかわりそう！</b>' : ''}</div></div>
    <div class="meters" style="margin-top:8px">${st.k !== 'pupa' ? m('おなか', c.hunger) : ''}${m('しめりけ', c.wet)}${m('きれいさ', c.clean)}${m('元気', g)}</div>

    <div class="acts">
      <button type="button" class="btn ${st.k !== 'pupa' && c.hunger < 60 ? 'pri' : ''}" id="aFeed" ${st.k === 'pupa' ? 'disabled' : ''}>エサをあげる<small>${esc(food.name)}${food.price ? ` ×${S.items[foodKey]||0}` : ''}</small></button>
      <button type="button" class="btn ${c.wet < 60 ? 'pri' : ''}" id="aWet">きりふき<small>水をシュッとかける</small></button>
      <button type="button" class="btn ${c.clean < 60 ? 'pri' : ''}" id="aClean">そうじ<small>フンや古いエサをとる</small></button>
      <button type="button" class="btn sub" id="aLook">じっくり見る<small>ずかんでしらべる</small></button>
      <button type="button" class="btn sub" id="aRelease">もとの場所にかえす<small>${st.k === 'adult' && c.pending ? 'ごほうびがもらえる' : 'いつでもできる'}</small></button>
    </div>`;
  $('btnBack').onclick = ()=>{ openCase = null; render(); };
  $('aFeed').onclick = async ()=>{
    if(c.hunger > 80){ await say(`${b.name}は、まだおなかがいっぱいみたい。\nエサは、なくなったら新しいものにかえよう。`); return; }
    if(!haveFood){ await say(`「${food.name}」がない！\nおうちの「どんぐりでエサを買う」で買えるよ。`); return; }
    if(food.price) S.items[foodKey]--;
    c.hunger = 100; c.tick = now(); save();
    await yakusoku('feed', 'エサは、毎日見て、古くなったらとりかえよう。\n生きものを飼うということは、毎日の「つづける」ことなんだ。');
    renderObs();
  };
  $('aWet').onclick = async ()=>{
    if(c.wet > 80){ await say('もう十分しめっているよ。\nしめらせすぎると、カビがはえたり、虫が弱ったりするんだ。'); return; }
    c.wet = 100; save();
    await yakusoku('wet', 'きりふきは「しっとり」くらいでちょうどいい。びしょびしょにしないでね。');
    renderObs();
  };
  $('aClean').onclick = async ()=>{
    if(c.clean > 80){ await say('もうきれいだよ。\nさわりすぎると、虫がつかれてしまうから、そっとしておこう。'); return; }
    if(st.k === 'pupa' && !(await ask('さなぎのまわりは、動かさないほうがいい。\nケースのそとがわだけ、そっとそうじする？', 'そっとそうじする', 'やめておく'))) return;
    c.clean = 100; save();
    await yakusoku('clean', 'フンや古いエサは、こまめにとってあげよう。\n虫をさわるときは、力を入れずに、そっとね。');
    renderObs();
  };
  $('aLook').onclick = ()=> showDexDetail(c.bug);
  $('aRelease').onclick = async ()=>{
    const done = st.k === 'adult' && c.pending;
    if(!(await ask(done ? `${b.name}は、りっぱな成虫になった。\nみつけた場所（${esc(c.from)}）に、かえしてあげる？` : `${b.name}を、まだとちゅうだけど、みつけた場所（${esc(c.from)}）にかえす？`, 'かえす', 'やめる'))) return;

    else { S.money += 5; await say(`${b.name}を${c.from}にかえした。\n「元気でね！」`); }
    await yakusoku('release', '観察がおわったら、みつけた場所にかえしてあげよう。\nちがう場所にはなすと、そこにいる虫たちがこまってしまうんだ。');
    save(); openCase = null; refresh();
  };
  // すがたがかわる演出（ケースをのぞいたときに見せる）
  if(c.pending){ await wait(600); await playEvent(c); }
}
async function playEvent(c){
  const b = BUGS[c.bug], cur = stageOf(c), nx = b.plan[c.si+1], ins = b.plan.slice(0, c.si).filter(s=>s.k==='larva').length;
  if(!nx){   // 成虫のさいご：かえすとき
    if(!c.doneSaid){ c.doneSaid = 1; save(); await say(`${b.name}は、すっかり元気な成虫になった！\nそろそろ、みつけた場所にかえしてあげよう。\n（「もとの場所にかえす」でごほうびがもらえる）`); }
    return;
  }
  const kind = cur.k === 'larva' && nx.k === 'larva' ? 'molt' : nx.k === 'pupa' ? 'pupate' : 'emerge';
  const L = document.createElement('div'); L.id = 'evLayer';
  const oldSvg = svgBug(c.bug, cur.k, {instar:ins}), newSvg = svgBug(c.bug, nx.k, {instar:ins+1, cls: kind === 'emerge' ? 'ev-emerge' : ''});
  const ttl = {molt:'脱皮した！', pupate:'さなぎになった！', emerge:'羽化した！'}[kind];
  const cap = {molt:`${b.name}の幼虫は、古い皮をぬいで\nひとまわり大きくなった！`, pupate:`${b.name}の幼虫は、じっと動かなくなって…\nさなぎになった！`, emerge:`${b.name}の成虫が出てきた！\nはねが、ゆっくりひろがっていく…`}[kind];
  L.innerHTML = `<div class="stage"><div class="ly ${kind === 'emerge' ? 'ev-crack' : 'ev-old'}">${oldSvg}</div><div class="ly ev-new">${newSvg}</div>${kind === 'emerge' ? [20,45,70,30,60,80].map((x,i)=>`<i class="spark" style="left:${x}%;top:${40+(i%3)*15}%;animation-delay:${1.5+i*.2}s"></i>`).join('') : ''}</div><div class="ttl norb" hidden>${ttl}</div><div class="cap" hidden>${esc(cap).replace(/\n/g,'<br>')}</div>`;
  document.body.appendChild(L);
  await wait(kind === 'emerge' ? 3800 : 2600);
  L.querySelector('.ttl').hidden = false; L.querySelector('.cap').hidden = false;
  await new Promise(r=>{ L.onclick = r; setTimeout(r, 6000); });
  L.remove();
  // 次のすがたへ
  c.si++; c.prog = 0; c.pending = false; c.tick = now(); if(nx.k === 'pupa') c.hunger = 100;
  const bonus = {molt:10, pupate:20, emerge:30}[kind]; S.money += bonus; S.stats[kind] = (S.stats[kind]||0) + 1;
  if(kind === 'emerge'){ S.dex[c.bug].adult = dayKey(); S.stats.raised++; }
  save();
  await say(`${ttl}　どんぐり ${dg(bonus)} をもらった。`);
  if(kind === 'molt') await yakusoku('molt', '脱皮したばかりの虫は、体がやわらかい。\nしばらくは、さわらないでそっと見ていよう。');
  if(kind === 'pupate') await yakusoku('pupate', 'さなぎの中では、体がまるごと作りかえられている。\nゆらしたり、さわったりしないでね。');
  if(kind === 'emerge') await yakusoku('emerge', '羽化したばかりのはねは、まだやわらかい。\nはねがかわいてかたくなるまで、そっとしておこう。');
  renderObs();
}
// 元気がとても低いままだった虫は、自然にかえる
async function handleGone(){
  for(let i=0;i<S.cases.length;i++){ const c = S.cases[i]; if(!c || !c.gone) continue;
    S.cases[i] = null; save();
    await say(`${BUGS[c.bug].name}は、元気がなくなって、ケースから出ていってしまった…。\nお世話が足りなかったみたい。\n【そだてのやくそく】\n飼うときめたら、毎日、エサとしめりけとそうじを見てあげよう。`);
    render();
  }
}

    <div class="row"><button type="button" class="btn pri" id="btnGeo">📍 いまいる場所をしらべる</button></div>
    <div class="spots" style="margin-top:10px">${SPOTS.map(sp=>{ const v = (S.visits[sp.key+'|'+today]||0);
      return `<div class="spot"><b>${esc(sp.name)}</b>　<span class="small">${esc(sp.env)}</span><div class="bugs">${slot ? `いま：${spotBugs(sp.key, slot).map(id=>BUGS[id].name).join('・') || 'おやすみ中'}` : ''}　／　ほか：${spotBugs(sp.key).filter(id=>!BUGS[id].time.includes(slot) && !BUGS[id].spots.includes('any')).map(id=>`${BUGS[id].name}（${BUGS[id].time.map(t=>SLOT_NAMES[t]).join('・')}）`).join('・') || 'なし'}</div>${v ? `<div class="small">今日は${v}回さがした</div>` : ''}</div>`; }).join('')}
    <div class="spot"><b>${esc(ANY_SPOT.name)}</b>　<span class="small">宗像のそと・どこでも</span><div class="bugs">${spotBugs('any').map(id=>BUGS[id].name).join('・')}</div></div></div>
    <div class="demoBox" style="margin-top:12px"><h3>デモ用（本番にはありません）</h3><p class="small">じっさいに宗像に行かなくても、場所をえらんで「着いたことにする」ができます。</p>
      <div class="row"><select id="demoSpot" class="btn">${SPOTS.map(sp=>`<option value="${sp.key}">${esc(sp.name)}</option>`).join('')}<option value="any">宗像のそと（どこでも）</option></select><button type="button" class="btn" id="btnDemoGo">着いたことにする</button></div></div>`;
  $('btnGeo').onclick = async ()=>{
    if(!(await askTogether())) return;
    const box = document.createElement('div'); box.className = 'win'; box.textContent = 'いる場所をしらべています…'; view.prepend(box);
    let pos; try{ pos = await getPos(); }catch(e){ box.innerHTML = '位置情報がつかえませんでした。<br><small>スマホの設定で、このページ（Safari／Chrome）の位置情報が「許可」になっているか確かめてね。</small>'; return; }
    const sp = nearSpot(pos.lat, pos.lon); pos = null;   // 位置そのものはすぐに捨てる
    box.remove(); arrive(sp || ANY_SPOT, !sp);
  };
  $('btnDemoGo').onclick = async ()=>{ if(!(await askTogether())) return; const k = $('demoSpot').value; arrive(k === 'any' ? ANY_SPOT : SPOTS.find(s=>s.key===k), k === 'any'); };
}
async function askTogether(){   // 安全の確認（1日1回）
  const k = 'out|' + dayKey(); if(S.yk[k]) return true;
  const ok = await ask('そとに出る前に…\nおうちの人といっしょ？', 'いっしょにいる', '子どもだけ');
  if(!ok){ await say('そとで虫をさがすのは、おうちの人といっしょのときだけ。\nおうちの人のスマホで、いっしょに開いてもらおう！'); return false; }
  S.yk[k] = 1; save(); return true;
}
async function arrive(sp, outside){
  const today = dayKey();
  // 動いたきょり → どんぐり（場所と場所のあいだのきょり。自分の位置は使わない）
  let got = 0, moved = '';
  if(S.last && S.last.key !== sp.key && S.last.lat && sp.lat){ const km = distM(S.last.lat, S.last.lon, sp.lat, sp.lon)/1000; got = clamp(Math.round(km*10), 5, 60); moved = `${S.last.name}から${km.toFixed(1)}km歩いた！`; }
  else if(!S.last || S.last.day !== today){ got = 10; moved = '今日はじめてのおでかけ！'; }
  const giftKey = sp.key + '|gift|' + today; let gift = '';
  if(!S.yk[giftKey] && sp.gift){ S.yk[giftKey] = 1; S.items[sp.gift] = (S.items[sp.gift]||0) + 2; gift = `\n${sp.name}で「${ITEMS[sp.gift].name}」を2つ手に入れた。`; }
  S.money += got; S.last = {key:sp.key, name:sp.name, lat:sp.lat, lon:sp.lon, day:today}; save(); hud();
  outState = {spot:sp, outside};
  await say((outside ? '宗像のスポットの近くではないみたい。\nでも、どこにでもいる虫ならさがせるよ。' : `「${sp.name}」に着いた！`) + (moved ? `\n${moved} どんぐり ${dg(got)} をもらった。` : '') + gift);
  if(!outside) await say(`【注意】${sp.warn}`);
  renderSpot();
}
function renderSpot(){
  const sp = outState.spot, slot = slotOf(), today = dayKey(), key = sp.key + '|' + today, used = S.visits[key]||0, left = FINDS_PER_VISIT - used;
  const here = spotBugs(sp.key, slot), later = spotBugs(sp.key).filter(id=>!here.includes(id));
  view.innerHTML = `<div class="row" style="justify-content:space-between"><h2>${esc(sp.name)}</h2><button type="button" class="btn sub" id="btnLeave">おうちにかえる</button></div>
    <div class="spot here"><div class="small">${esc(sp.env)}　いまは${SLOT_NAMES[slot]}</div>
      <div>いまみつかりそう：${here.map(id=>BUGS[id].name).join('・') || 'おやすみ中'}</div>
      ${later.length ? `<div class="bugs">べつの時間：${later.map(id=>`${BUGS[id].name}（${BUGS[id].time.map(t=>SLOT_NAMES[t]).join('・')}）`).join('・')}</div>` : ''}</div>
    <div id="findBox" class="search"><p>草むらや木のまわりを、そっとのぞいてみよう。</p><p class="small">今日ここでさがせるのは、あと${left}回</p>
      <button type="button" class="btn pri" id="btnFind" ${left <= 0 || !here.length ? 'disabled' : ''} style="font-size:18px;padding:.6em 1.6em">🔍 さがす</button></div>`;
  $('btnLeave').onclick = ()=>{ outState = null; setTab('home'); };
  $('btnFind').onclick = ()=> doFind(sp, here);
}
async function doFind(sp, here){
  const key = sp.key + '|' + dayKey(); S.visits[key] = (S.visits[key]||0) + 1; save();
  const box = $('findBox'); box.innerHTML = `<p class="dots">${pick(['草をかきわけている', '木のねもとをのぞいている', '葉のうらを見ている', 'じっと耳をすませている'])}</p>`;
  await wait(1400);
  // めずらしい虫（rank が高い）ほど出にくい。何も見つからないこともある
  const pool = []; here.forEach(id=>{ const w = {1:5, 2:3, 3:2}[BUGS[id].rank]; for(let i=0;i<w;i++) pool.push(id); }); for(let i=0;i<3;i++) pool.push(null);
  const id = pick(pool);
  if(!id){ box.innerHTML = `<p>…今回は、みつからなかった。</p><p class="small">虫は、きみのことをよく見ている。もう一度、しずかにさがしてみよう。</p><button type="button" class="btn" id="btnAgain">もどる</button>`; $('btnAgain').onclick = renderSpot; return; }
  const b = BUGS[id], first = !S.dex[id];
  S.dex[id] = S.dex[id] || {found:dayKey(), where:sp.name}; save();
  box.innerHTML = `<div class="found"><span class="ex norb">！</span><div class="pic">${b.watch ? svgBest(id) : svgBug(id, 'larva', {instar:0})}</div>
    <div class="win" style="width:100%">${esc(b.find)}${first ? '<br><b class="yk">はじめてみつけた！ ずかんに登録。</b>' : ''}</div>
    <div class="row" id="foundBtns"></div></div>`;
  const btns = $('foundBtns');
  if(b.watch){
    btns.innerHTML = `<button type="button" class="btn pri" id="bWatch">見るだけにする</button>`;
    $('bWatch').onclick = async ()=>{ await say(`${b.name}は、きれいな川の水と、エサのカワニナがないと育たない。\nつかまえずに、光るようすを見ていよう。`); await yakusoku('watch', '飼えない虫や、ぐあいの悪そうな虫は、見るだけにしよう。\n「つかまえない」も、虫とのいいつきあいかたなんだ。'); renderSpot(); };
    return;
  }
  const free = S.cases.findIndex(c=>!c);
  btns.innerHTML = `<button type="button" class="btn pri" id="bTake" ${free < 0 ? 'disabled' : ''}>つれてかえる</button><button type="button" class="btn" id="bLeave">そっとしておく</button>${free < 0 ? '<div class="small">ケースがいっぱい。おうちで虫をかえしてからにしよう。</div>' : ''}`;
  $('bLeave').onclick = ()=> renderSpot();
  $('bTake').onclick = async ()=>{
    const foodKey = b.food, food = ITEMS[foodKey];
    if(food.price && !(S.items[foodKey]||0)) await say(`つれてかえるなら、ごはんの「${food.name}」がいるよ。\nおうちの「どんぐりでエサを買う」で買っておこう。（いまのどんぐり：${dg(S.money)}）`);
    S.cases[free] = {bug:id, si:0, prog:0, hunger:70, wet:70, clean:100, tick:now(), pending:false, from:sp.name, since:dayKey()};
    save(); hud();
    await say(`${b.name}の幼虫を、${free+1}ばんめのケースに入れた。`);
    await yakusoku('take', '虫をつれてかえるときは、いきをしやすいように、ふたにあなをあけたケースに。\n日なたにおくと、あつくて弱ってしまうよ。');
    renderSpot();
  };
}

/* ---- ずかん ---- */
function renderDex(){
  const ids = Object.keys(BUGS), n = ids.filter(id=>S.dex[id]).length, r = ids.filter(id=>S.dex[id] && S.dex[id].raised).length;
  view.innerHTML = `<h2>こん虫ずかん</h2><p class="small">みつけた ${n} / ${ids.length}　そだてた ${r}</p>
    <div class="dexGrid">${ids.map(id=>{ const d = S.dex[id], b = BUGS[id];
      return `<div class="d ${d ? '' : 'no'}" data-id="${id}">${svgBest(id, {cls: d ? '' : 'sil'})}<div>${d ? esc(b.name) : '？？？'}</div>${d ? `<span class="mk">${d.raised ? '★そだてた' : d.adult ? '羽化した' : '見つけた'}</span>` : ''}</div>`; }).join('')}</div>`;
  view.querySelectorAll('.d').forEach(el=> el.onclick = ()=> showDexDetail(el.dataset.id));
}
function showDexDetail(id){
  const b = BUGS[id], d = S.dex[id];
  const stages = b.watch ? '' : b.plan.map((s,i)=> `${STAGE_NAME[s.k]}${s.k==='larva' ? i+1 : ''} ${s.days}日`).join(' → ');
  openPanel(d ? b.name : '？？？', `<div class="paper">
    <div class="pic">${svgBest(id, {cls: d ? '' : 'sil'})}</div>
    ${d ? `<p>${esc(b.desc)}</p>
    <table><tr><td>みつかる場所</td><td>${b.spots.includes('any') ? 'どこでも' : b.spots.map(k=>SPOTS.find(s=>s.key===k).name).join('・')}</td></tr>
      <tr><td>時間帯</td><td>${b.time.map(t=>SLOT_NAMES[t]).join('・')}</td></tr>
      ${b.watch ? '<tr><td>そだてる</td><td>見るだけ（飼えない）</td></tr>' : `<tr><td>ゲームでの育ちかた</td><td>${stages}</td></tr><tr><td>ごはん</td><td>${esc(ITEMS[b.food].name)}${b.foodAdult !== b.food ? `（成虫は${esc(ITEMS[b.foodAdult].name)}）` : ''}</td></tr>`}
      <tr><td>じっさいは</td><td>${esc(b.real)}</td></tr>
      <tr><td>飼いかた</td><td>${esc(b.care)}</td></tr>
      <tr><td>きろく</td><td>${esc(d.found)} に ${esc(d.where)} でみつけた${d.adult ? `<br>${esc(d.adult)} に羽化した` : ''}${d.raised ? `<br>${esc(d.raised)} に、さいごまでそだててかえした` : ''}</td></tr></table>`
    : '<p>まだみつけていない虫。</p>'}</div>`);
}

/* ---- オプション ---- */
function renderOpt(){
  view.innerHTML = `<h2>オプション</h2><div class="opt">
    <button type="button" class="btn" id="oFuri"><span>ふりがな</span><span class="v">${furiMode ? 'たくさん（小3から）' : 'ふつう（小5から）'}</span></button>
    <button type="button" class="btn" id="oAuto"><span>じどうセーブ<br><small class="small">ほかのアプリに切りかえたとき、セーブする</small></span><span class="v">${autoSave ? 'ON' : 'OFF'}</span></button>
    <button type="button" class="btn" id="oSave"><span>いますぐセーブ</span><span class="v">▸</span></button>
    <button type="button" class="btn" id="oVer"><span>こうしん情報</span><span class="v">ver ${GAME_VER}</span></button>
    <button type="button" class="btn" id="oPriv"><span>プライバシーについて</span><span class="v">▸</span></button>
    <button type="button" class="btn" id="oInstall"><span>アプリにする方法</span><span class="v">▸</span></button>
    <button type="button" class="btn" id="oTitle"><span>タイトルにもどる</span><span class="v">▸</span></button>
  </div>
  <div class="demoBox" style="margin-top:14px"><h3>デモ用（本番にはありません）</h3>
    <p class="small">本番では、虫は本物の時間で育ちます（プレイヤーが時間を速めることはできません）。デモで成長を見るために、時間をすすめられます。いま、本物の時間より <b>${Math.round((S.demoOff||0)/H)}時間</b> 先。</p>
    <div class="row"><button type="button" class="btn" data-h="6">6時間すすめる</button><button type="button" class="btn" data-h="24">1日すすめる</button><button type="button" class="btn sub" data-h="0">もとにもどす</button></div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn" id="oMoney">どんぐりを +50</button><button type="button" class="btn sub" id="oClear">セーブを消す</button></div></div>`;
  $('oFuri').onclick = ()=>{ setFuri(!furiMode); renderOpt(); };
  $('oAuto').onclick = ()=>{ setAutoSave(!autoSave); renderOpt(); };
  $('oSave').onclick = async ()=>{ save(); await say('セーブした。'); };
  $('oVer').onclick = showChangelog; $('oPriv').onclick = showPrivacy; $('oInstall').onclick = showInstall;
  $('oTitle').onclick = ()=>{ save(); S = null; outState = null; render(); };
  view.querySelectorAll('[data-h]').forEach(b=> b.onclick = ()=>{ const h = +b.dataset.h; S.demoOff = h ? (S.demoOff||0) + h*H : 0; if(!h) S.cases.forEach(c=>{ if(c) c.tick = Math.min(c.tick, Date.now()); }); save(); refresh(); setTab('opt'); });
  $('oMoney').onclick = ()=>{ S.money += 50; save(); hud(); };
  $('oClear').onclick = async ()=>{ if(!(await ask('セーブを消して、はじめからにする？', '消す', 'やめる'))) return; clearSave(); S = null; outState = null; render(); };
}

/* ---- 説明パネル ---- */
function openPanel(title, html){
  const p = document.createElement('div'); p.className = 'full';
  p.innerHTML = `<div class="in"><div class="top"><h2>${esc(title)}</h2></div><div>${html}</div></div><button type="button" class="btn close">とじる</button>`;
  p.querySelector('.close').onclick = ()=> p.remove();
  document.body.appendChild(p); return p;
}
function showChangelog(){
  openPanel('こうしん情報', `<p>いま遊んでいるのは <b>ver ${GAME_VER}</b>${window.DEMO ? '（デモ版）' : ''} です。<br><small>公開番号 ${esc(BUILD)}</small></p>
    <p class="small">新しい版が出ると、画面の上に「こうしんする」が出ます。</p>
    <div class="chlog">${CHANGELOG.map((c,i)=>`<h3>ver ${esc(c.v)}${i===0 ? '<span class="now norb">いまのバージョン</span>' : ''}<small> ${esc(c.date)}</small></h3><ul>${c.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`).join('')}</div>`);
}
function showPrivacy(){
  openPanel('プライバシーについて', `
    <h3>こどものみんなへ</h3>
    <ul><li>このゲームは、名前・写真・いる場所を<b>どこにも送りません</b>。</li>
      <li>そだてている虫やずかんの記録は、<b>この端末の中にだけ</b>のこります。</li>
      <li>「いまいる場所をしらべる」は、宗像の場所の近くにいるかを調べるだけ。いる場所は保存も送信もしません。</li>
      <li>わからないことがあったら、おうちの人に見てもらってね。</li></ul>
    <h3>保護者の方へ</h3>
    <p>このデモ版は、アクセス解析などを入れておらず、外部にデータを送信しません。位置情報は、端末の中で「登録済みのスポットの半径内にいるか」を判定するためだけに使い、判定後すぐに破棄します。セーブデータはブラウザの localStorage にのみ保存されます。</p>
    <p>屋外での採集は、保護者の方のスマートフォンで、お子さんと一緒に行う前提で設計しています。アプリは1日1回「おうちの人といっしょ？」と確認します。</p>`);
}
function showInstall(){
  openPanel('アプリにする方法', `<h3>iPhone・iPad（Safari）</h3><ol><li>画面の下の「共有」ボタン（四角から矢印が出ている形）を押す</li><li>「ホーム画面に追加」を押す</li></ol>
    <h3>Android（Chrome）</h3><ol><li>右上の「︙」を押す</li><li>「ホーム画面に追加」または「アプリをインストール」を押す</li></ol>
    <p class="small">ホーム画面のアイコンから開くと、アプリのように全画面で遊べます。</p>`);
}

/* キーボード：Esc／X で とじる・もどる（虫とり日記の B ボタンと同じ） */
addEventListener('keydown', e=>{
  if(e.key !== 'Escape' && e.key.toLowerCase() !== 'x') return;
  const ful = [...document.querySelectorAll('.full')].pop(); if(ful){ ful.remove(); return; }
  const msg = $('msgLayer'); if(msg && !msg.querySelector('.ans')){ msg.click(); return; }
  if(openCase !== null){ openCase = null; render(); }
});

/* 起動 */
render();
setInterval(()=>{ if(S && !$('msgLayer') && !$('evLayer')){ tickAll(); hud(); if(openCase === null && tab === 'home') render(); } }, 60*1000);   // 1分ごとに、おなかなどをへらす
</script>
</html>
